    roles: [preservative, buffer, solvent]
    kind: component
    acid_base:
      charge_most_protonated: 0
      reference_protons: 2
      pka:
        - {value: 1.86, unit: "1", source: literature, ref: "Goldberg & Parker, J. Res. NBS 90, 341 (1985); DEV 6.2"}
        - {value: 7.19, unit: "1", source: literature, ref: "Goldberg & Parker 1985; DEV 6.2"}
      ionisation_enthalpy:
        - {value: 0.0, unit: kJ/mol, source: assumed, note: "irrelevant above pH 4"}
        - {value: -3.65, unit: kJ/mol, source: literature, ref: "Goldberg & Parker 1985; DEV 6.2"}
      activity_class: sulfite
    diffusion_coefficient: {value: 1030, unit: um2/s, source: assumed, note: "Nernst-Hartley for Na2SO3 (the bulk electrolyte, so the salt value applies) from recalled ionic D (DEV 6.3), scaled to 20 C"}
    gel_diffusion_ratio: {value: 0.5, unit: "1", source: assumed, bounds: [0.3, 0.8], note: "Iwano KBr 0.8 at 8 % and 0.55 at 20 % gelatin (KIN 3.2), extrapolated to the 30-45 wt % swollen emulsion (spec D1 2.3.7 note)"}

