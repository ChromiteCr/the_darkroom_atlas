# Chemical species of the D1 black-and-white chain (spec D1 2.3.1, 2.3.7, 5.2).
#
# Two kinds of entry:
# * ingredient: weighed into a bath; dissolves into components (dissolves_to, mol/mol), adds
#   `toth` mol of proton excess per mol relative to the components' reference states, and
#   brings Na+/K+ (cations) and spectator ions (spectator_charge) that only enter the ionic
#   strength. Each spectator entry here is one ion per formula unit, so its value is both the
#   ion's charge and the charge per mol of ingredient.
# * component: transported and reacted. Its molar_mass is that of the reference state, so a
#   bath may also weigh a component directly (dissolves_to {self: 1}, toth 0, no cations).
#   acid_base lists the states most protonated first; the reference state has
#   `reference_protons` fewer protons than the most protonated one.
#
# Diffusion coefficients are in water at 20 C. `toth` (the proton excess TOTH) and `gelatin`
# (the immobile buffer) are not species here: they are built-in pseudo-components that
# chemistry/species.py component_table appends, with the gelatin pK taken from kinetics.yaml
# (spec D1 2.3.1, 2.3.7, 2.4.11).
#
# Source tags follow spec D1 0.2. Report abbreviations: DEV = docs/research/d1/
# developer-formulas.md, TMX = t-max-developer.md, KIN = development-kinetics.md.
schema_version: 1
