# Published D-76 formula, Elon 2 / sodium sulfite 100 / hydroquinone 5 / borax 2 g/L of stock
# (spec D1 1.1). Report abbreviations: DEV = docs/research/d1/developer-formulas.md.
schema_version: 1
id: d-76-published
name: Kodak D-76 (published formula)
kind: developer
formula_confidence: published
variant: published
base_solution: stock
components:
  - {species: metol-sulfate, amount: {value: 2.0, unit: g/L, source: literature, ref: "Carlton & Crabtree, Trans. SMPE 13 (1929) 406, Table II expt. 1 and p. 420; DEV 1.1"}}
  - {species: sodium-sulfite, amount: {value: 100.0, unit: g/L, source: literature, ref: "Carlton & Crabtree 1929, Table II expt. 1; DEV 1.1"}}
  - {species: hydroquinone, amount: {value: 5.0, unit: g/L, source: literature, ref: "Carlton & Crabtree 1929, Table II expt. 1; DEV 1.1"}}
  - {species: borax-decahydrate, amount: {value: 2.0, unit: g/L, source: literature, ref: "Carlton & Crabtree 1929, Table II expt. 1; DEV 1.1"}}
ph_anchors:
  - dilution: stock
    temperature: {value: 25, unit: C, source: assumed, note: "measurement temperature not stated in Carlton & Crabtree 1929 (development tests at 65 F); 25 C as for the other anchors (spec D1 12.4)"}
    ph: {value: 8.5, unit: "1", source: literature, ref: "Carlton & Crabtree 1929, Table II expt. 1, LaMotte colorimetric indicator +-0.1; DEV 1.3", uncertainty: 0.1}
    method: colorimetric
    note: "only relative values reliable (authors); the series shares the offset delta_CC in calibration (spec D1 7.2)"
standard_dilutions: ["stock", "1+1"]
refs:
  - "H.C. Carlton & J.I. Crabtree, Some properties of fine-grain developers for motion picture film, Trans. SMPE XIII no. 38, 406-444 (1929); DEV 1.1"
  - "Cinematographic Annual vol. 1 (ASC, 1930), pp. 119-120, Formula D-76; DEV 1.1"
  - "Kodak J-78 (Dec 2017), pp. 2 and 5: full strength or 1:1; DEV 1.3"
note: >-
  No initial bromide. Carlton & Crabtree 1929 Table II also gives, on the same 2/5/100 base,
  pH 8.1 without borax (expt. 12), 8.9 with 6 g/L borax (expt. 11), 9.2 with 20 g/L (expt. 10),
  8.1 for Elon 4 + HQ 5 + borax 2 (expt. 8) and 8.6 for Elon 2 + borax 2 without HQ
  (expt. 14), all colorimetric (DEV 1.3); these are other formulas and are anchors of the
  calibration series (spec D1 7.2), not of this file. Ideal-solution pH 8.94 (DEV 5.2).
