# KODAK HC-110 Developer, formulation before 2019 (amine-SO2 liquid concentrate), the one
# behind the Kodak reference data (spec D1 1.1, 5.9; DEV 3.1, 7 item 1). The composition is
# from SDS copies of 2009, 2014 (v4.0) and 2016 (v4.1) seen only as search snippets
# (secondary; unverified by the DEV 8 spot-check), so every value is assumed and only a
# prior. Amounts are g/L of CONCENTRATE: w/w midpoint x an assumed density 1.15 kg/L, bounds
# from the range ends x 1.1-1.2 kg/L (density not found; DEV 3.1).
# Report abbreviations: DEV = docs/research/d1/developer-formulas.md, TMX = t-max-developer.md.
schema_version: 1
id: hc-110-pre2019
name: KODAK HC-110 Developer (pre-2019 formulation)
kind: developer
formula_confidence: msds-estimated
variant: pre2019
base_solution: concentrate
components:
  - {species: diethanolamine, amount: {value: 373.75, unit: g/L, source: assumed, bounds: [330.0, 420.0], note: "SDS 30-35 % (an EU sheet 35.0 %), secondary per DEV 3.1"}}
  - {species: sulfur-dioxide, amount: {value: 201.25, unit: g/L, source: assumed, bounds: [165.0, 240.0], note: "SDS 15-20 %, secondary per DEV 3.1; adduct stoichiometry not stated (DEV 6.2)"}}
  - {species: hydroquinone, amount: {value: 86.25, unit: g/L, source: assumed, bounds: [55.0, 120.0], prior: uniform, note: "SDS 5-10 % (an EU sheet 10.0 %), secondary per DEV 3.1"}}
  - {species: diethylene-glycol, amount: {value: 86.25, unit: g/L, source: assumed, bounds: [55.0, 120.0], note: "SDS 5-10 %, secondary per DEV 3.1"}}
  - {species: ethanolamine, amount: {value: 86.25, unit: g/L, source: assumed, bounds: [55.0, 120.0], note: "SDS 5-10 %, secondary per DEV 3.1"}}
  - {species: methylphenidone, amount: {value: 8.625, unit: g/L, source: assumed, bounds: [2.29, 12.0], prior: uniform, note: "listed in the 2014/2016 SDS, % not seen (DEV 3.1); centre = hydroquinone / 10 by the HQ : pyrazolidone mass ratio 10 : 1 of DE 1,118,005 Examples 1, 6, 7, 8 (opened, DEV 3.1); bounds from HQ 5 % / 24 (Example 29, 0.25 : 6) x 1.1 to HQ 10 % / 10 x 1.2"}}
  - {species: potassium-bromide, amount: {value: 23.0, unit: g/L, source: assumed, bounds: [11.0, 36.0], prior: uniform, note: "listed as 'contains', % not seen; 1-3 % by analogy with the 2019 SDS (estimate, DEV 3.1), about 3-9 mM at 1+31"}}
  - {species: potassium-hydroxide, amount: {value: 173.7, unit: g/L, source: assumed, bounds: [0.0, 343.3], prior: uniform, note: "undisclosed alkali as KOH equivalent, nuisance fitted in stage A against the CIS-61 dilution A anchor (spec D1 7.1). The SDS mid-ranges alone give an ideal pH 6.4-7.3, impossible for an active developer (DEV 3.1). Centre: the amount that gives pH 8.9 at 1+15, 25 C, with the SIT Debye-Hueckel term and d_eps = 0 (spec D1 2.3.3); upper bound: the amount that gives pH 10.0 there (top of the DE 1,118,005 analogues 9.6-10.0 at 1+20, DEV 3.1); lower bound 0 (other SO2 accounting, DEV 3.1)"}}
nuisance: [potassium-hydroxide, hydroquinone, methylphenidone, potassium-bromide]
ph_anchors:
  - dilution: "1+15"
    temperature: {value: 25, unit: C, source: datasheet, ref: "Kodak CIS-61 (Oct 1999, Feb 2003, May 2010); TMX 10.1"}
    ph: {value: 8.9, unit: "1", source: datasheet, ref: "Kodak CIS-61 (Oct 1999, Feb 2003, May 2010), typical value, HC-110 Developer dilution A (1:15); TMX 10.1", uncertainty: 0.10}
    method: typical
    note: "CIS-61 specific gravity 1.015 +- 0.003 at dilution A and 1.008 +- 0.003 at dilution B (pH '-' at B), 25 C; all three editions predate the 2019 change (TMX 10.1)"
standard_dilutions: ["1+15", "1+31", "1+19", "1+39", "1+47", "1+79"]
refs:
  - "Kodak HC-110 SDS 2009-09-11, 2014-05-02 v4.0 (Z17000000795), 2016-05-26 v4.1; secondary per DEV 3.1"
  - "DE 1,118,005 / GB 958,678 (Eastman Kodak, priority 1959): amine-SO2 developer concentrates; DEV 3.1"
  - "Kodak J-24 (Dec 2017) p. 2: dilutions A-F from concentrate (part + parts); DEV 3.3"
  - "Kodak CIS-61 (1999, 2003, 2010): dilution A pH 8.9 +- 0.10; TMX 10.1"
note: >-
  Dilutions are from the concentrate: A 1+15, B 1+31, C 1+19, D 1+39, E 1+47, F 1+79 (J-24;
  stock is 1+3). The SDS also list ethylene glycol 0.1 to < 1 % (2009) and an unidentified
  chelating agent; neither is in the species table and both are left out. CIS-61 also gives
  HC-110 Developer Replenisher dilution A pH 9.1 +- 0.10 (25 C, TMX 10.1). The DE 1,118,005
  analogues have pH 9.6-10.0 at 1+20 (DEV 3.1).
