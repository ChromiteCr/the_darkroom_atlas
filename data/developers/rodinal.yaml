  Concentrate pH > 13 (ADOX SDS, a lower limit, so not a ph_anchor); working pH not found.
  DEV 5.2 ideal-solution sweeps over the undisclosed alkali and sulfite: 11.9-12.3 at 1+25,
  11.6-12.1 at 1+50 (DEV 4 gives 11.6-12.3 and 11.4-12.1), falling by about 0.3 per
