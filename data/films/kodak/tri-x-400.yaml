# KODAK PROFESSIONAL TRI-X 400 Film (400TX) for the bw-mechanistic model (spec D1 2.0, 5.4).
#
# Layer structure of spec D1 2.0.1: overcoat, emulsion (conventional polydisperse AgBrI grains),
# base with the 135 and 120 formats. Kodak publishes none of the emulsion parameters (LAT 2.1),
# so everything except the ISO speed and the base refractive index is `assumed`.
#
# Parameters the calibration fits (spec D1 7.1, blocks B and F) carry the bounds and prior of
# the spec's parameter tables and are `assumed` at their prior centre until the D1e calibration
# writes them back as `fitted` (spec D1 7.8). Their values are PLACEHOLDERS (spec D1 5.8) and
# must not be quoted as results. Where the spec names a prior centre it is used; otherwise the
# centre is the geometric midpoint of the bounds for a log prior ("lognormal") and the
# arithmetic midpoint otherwise ("uniform"); each note says which.
#
# spectral_sensitivity (spec D1 5.4, calibration only) points at the training curve
# reference/kodak/tri-x-400/spectral-sensitivity-d0.3.csv (density 0.3 above fog). The field
# holds one curve, so the d1.0 curve of the same directory is not referenced here.
schema_version: 1
id: kodak/tri-x-400
maker: Kodak
name: KODAK PROFESSIONAL TRI-X 400 (400TX)
kind: bw_negative
model: bw-mechanistic
iso_speed: {value: 400, unit: "1", source: datasheet, ref: "F-4017 Oct 2021 p. 6-7 (implied by push tables); DS 2.2"}
default_readout: scan_standard
default_format: "135"
refs:
  - "KODAK PROFESSIONAL TRI-X 320 and 400 Films, F-4017, October 2021"
  - "KODAK TRI-X Pan Film, F-9, April 2003 (legacy TX base thickness; OPT 1.2)"
note: >-
  Prior centres are PLACEHOLDERS until the D1e calibration (spec D1 5.8, 7.8). The spectral
  sensitivity, MTF and image-structure data of F-4017 belong to the older TRI-X Pan Film 5063
  (DS 2.1).
layers:
  - type: overcoat
    id: overcoat
    thickness: {value: 1.0, unit: um, source: assumed, bounds: [0.5, 2.0], note: "recalled typical value, OPT 1.4; spec D1 2.4.11"}
  - type: emulsion
    id: emulsion
    sensitized_to: panchromatic
    spectral_sensitivity: {quantity: spectral_sensitivity, source: datasheet, ref: "Kodak Alaris, KODAK PROFESSIONAL TRI-X 320 and 400 Films (Technical Data / Black-and-White Film), Publication F-4017, October 2021 (back cover \"Revised 10-21\"), p. 8, figure \"Spectral Sensitivity Curves\" (curve: the line the printed legend labels \"D=1.0>Gross Fog\", assigned to density 0.3 above gross fog, not 1.0 as printed, because the printed legend is swapped (see the legend_check condition)); https://kodakprofessional.com/sites/default/files/wysiwyg/film/f4017_trix_320400.pdf (sha256 1d86b030cf7a8502e6f1414c630fa2cda30b68df53f49bccccce73c9c6562078); digitised from the PDF's vector paths by tools/digitize/recipes/f4017-2021-10/p8-spectral-sensitivity.yaml; estimated error x +/-1.8162 nm, y +/-0.0193 log10(cm2/erg)", file: reference/kodak/tri-x-400/spectral-sensitivity-d0.3.csv}
    gelatin_coverage: {value: 5.0, unit: g/m2, source: assumed, bounds: [3.0, 8.0], note: "LAT 2.3 (Kofron US 4,439,520 coats 4.84 g/m2); spec D1 2.0.2"}
    swelling_ratio: {value: 3.0, unit: "1", source: assumed, bounds: [2.0, 5.0], note: "Iwano 'normal hardening', KIN 3.3; spec D1 2.4.11"}
    grain:
      morphology: conventional
      mean_diameter: {value: 0.9, unit: um, source: assumed, bounds: [0.4, 2.0], prior: lognormal, note: "PLACEHOLDER; prior centre of spec D1 5.8 and 6.6; no Kodak value, LAT 2.1"}
      sigma_log: {value: 0.45, unit: "1", source: assumed, bounds: [0.2, 0.7], prior: uniform, note: "PLACEHOLDER; prior centre of spec D1 5.8; textbook range 0.3-0.6 recalled, LAT 2.1"}
      silver_coverage: {value: 4.0, unit: g/m2, source: assumed, bounds: [2.0, 6.0], prior: lognormal, note: "PLACEHOLDER; prior centre of spec D1 2.0.2, fitted in block F (D1 2.5.3); no primary value, LAT 2.3"}
      halide: AgBrI
      iodide_fraction: {value: 0.04, unit: "1", source: assumed, bounds: [0.02, 0.10], note: "default of spec D1 2.0.2; textbook 2-10 mol% recalled, LAT 2.1"}
      n_classes: 6
    optics:
      gelatin_index: {value: 1.54, unit: "1", source: assumed, bounds: [1.53, 1.54], note: "unverified, OPT 1.1; spec D1 2.1.8"}
      intrinsic_absorption:
        alpha0: {value: 1.0, unit: um-1, source: assumed, bounds: [0.1, 10.0], prior: lognormal, note: "PLACEHOLDER; geometric midpoint of the spec D1 2.1.8 log prior; LAT 3.1"}
        edge_energy: {value: 2.7, unit: eV, source: assumed, bounds: [2.5, 2.9], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds; edge about 2.7 eV, LAT 3.1, OPT 1.1"}
        urbach_energy: {value: 0.085, unit: eV, source: assumed, bounds: [0.02, 0.15], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds; LAT 3.1"}
      dye_bands:
        - amplitude: {value: 0.05, unit: "1", source: assumed, bounds: [0.0, 0.1], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds (A <= 0.1); with the other prior centres the layer absorptance A_550 is 0.51 (two-stream, 135) and 0.26 (single pass), inside the [0.2, 0.6] constraint of spec D1 2.1.8 and 7.1; LAT 3.2"}
          peak_wavenumber: {value: 1.74, unit: um-1, source: assumed, bounds: [1.4, 2.0], prior: uniform, note: "PLACEHOLDER; local maximum of the training curve spectral-sensitivity-d0.3.csv at 573 nm (5063 emulsion, shape only, DS 2.1); LAT 3.2-3.3"}
          width: {value: 0.165, unit: um-1, source: assumed, bounds: [0.03, 0.3], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds; LAT 3.2-3.3"}
        - amplitude: {value: 0.05, unit: "1", source: assumed, bounds: [0.0, 0.1], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds (A <= 0.1); with the other prior centres the layer absorptance A_550 is 0.51 (two-stream, 135) and 0.26 (single pass), inside the [0.2, 0.6] constraint of spec D1 2.1.8 and 7.1; LAT 3.2"}
          peak_wavenumber: {value: 1.61, unit: um-1, source: assumed, bounds: [1.4, 2.0], prior: uniform, note: "PLACEHOLDER; local maximum of the training curve spectral-sensitivity-d0.3.csv at 619 nm (5063 emulsion, shape only, DS 2.1); LAT 3.2-3.3"}
          width: {value: 0.165, unit: um-1, source: assumed, bounds: [0.03, 0.3], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds; LAT 3.2-3.3"}
      scattering_550: {value: 0.225, unit: um-1, source: assumed, bounds: [0.05, 0.4], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds; S about 0.75/l*, OPT 2.3"}
      scattering_exponent: {value: 1.0, unit: "1", source: assumed, bounds: [0.5, 2.0], note: "OPT 2.3 Mie table; spec D1 2.1.8"}
      psf_weight: {value: 0.5, unit: "1", source: assumed, bounds: [0.0, 1.0], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.1.8 bounds; OPT 2.3"}
      psf_length: {value: 2.0, unit: um, source: assumed, bounds: [0.5, 5.0], prior: uniform, note: "PLACEHOLDER; prior centre of spec D1 5.8; upper bound from the OPT 2.4 tail fit"}
    latent:
      efficiency: {value: 0.525, unit: "1", source: assumed, bounds: [0.05, 1.0], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.2.7 bounds; LAT 1.2, 1.4"}
      efficiency_size_exponent: {value: 0.0, unit: "1", source: assumed, bounds: [-1.0, 1.0], note: "spec D1 2.2.7: 0 unless identifiable; LAT 1.3(d)"}
      tau0_median: {value: 0.22, unit: s, source: assumed, bounds: [0.01, 2.0], prior: lognormal, note: "PLACEHOLDER; geometric midpoint of LAT 1.4 range 0.05-1 s (spec D1 2.2.7)"}
      tau0_sigma_ln: {value: 2.0, unit: "1", source: assumed, bounds: [0.0, 4.0], prior: uniform, note: "PLACEHOLDER; arithmetic midpoint of the spec D1 2.2.7 bounds; Katz 1949 needs a trap-depth distribution, LAT 1.2"}
      ionic_time: {value: 3.162277660168379e-6, unit: s, source: assumed, bounds: [1.0e-7, 1.0e-4], prior: lognormal, note: "PLACEHOLDER; geometric midpoint of the spec D1 2.2.7 log prior; microsecond order recalled, LAT 1.4"}
      competing_sites: {value: 3.0, unit: "1", source: assumed, bounds: [2.0, 10.0], note: "spec D1 2.2.7, 12.3; LAT 1.2 E10"}
      hole_attack: {value: 0.0, unit: "1", source: assumed, bounds: [0.0, 1.0], note: "spec D1 2.2.7; LAT 1.3(b)"}
      cluster_cap: 5
    development:
      fog_hazard_ratio: {value: 3.1622776601683794e-4, unit: "1", source: assumed, bounds: [1.0e-6, 0.1], prior: lognormal, note: "PLACEHOLDER; geometric midpoint of the spec D1 2.4.11 log prior; KIN 1.8"}
      covering_power: {value: 0.6, unit: 1/(g/m2), source: assumed, bounds: [0.3, 1.0], prior: uniform, note: "PLACEHOLDER; prior centre of spec D1 6.6; OPT 4.2"}
      covering_power_size_exponent: {value: 0.5, unit: "1", source: assumed, bounds: [0.0, 1.0], note: "CP falls with grain size, OPT 4.2; spec D1 2.5.3"}
      physical_covering_ratio: {value: 0.5, unit: "1", source: assumed, bounds: [0.2, 1.0], note: "OPT 4.2 point 3; spec D1 2.5.3"}
      halide_density: {value: 0.3, unit: 1/(g/m2), source: assumed, bounds: [0.1, 0.6], note: "no data; acts only when fixing is incomplete; spec D1 2.5.3"}
      dye_density: {value: 0.0, unit: "1", source: assumed, bounds: [0.0, 0.1], note: "no residual-dye stain reported for 400TX; spec D1 2.5.3"}
      fixing_factor: {value: 1.0, unit: "1", source: assumed, note: "spec D1 2.6: Tri-X 1; no reference data"}
  - type: base
    id: base
    material: cellulose triacetate
    refractive_index: {value: 1.48, unit: "1", source: literature, ref: "US 6,398,371 B1; OPT 1.1", bounds: [1.47, 1.48]}
    formats:
      "135":
        thickness: {value: 127.0, unit: um, source: assumed, note: "5 mil for legacy TX (F-9 2003 p. 1); 400TX not stated in any F-4017 edition; OPT 1.2"}
        grey_density: {value: 0.10, unit: "1", source: assumed, bounds: [0.0, 0.2], note: "35 mm - 120 offset of the lowest plotted densities, interpretation as grey dye unverified; OPT 1.3; not fitted (spec D1 7.1)"}
        backing_density: {value: 0.0, unit: "1", source: assumed, note: "spec D1 2.1.8"}
      "120":
        thickness: {value: 91.0, unit: um, source: assumed, note: "3.6 mil legacy TX (F-9 2003 p. 1); 400TX not stated; OPT 1.2"}
        grey_density: {value: 0.0, unit: "1", source: assumed, note: "spec D1 2.1.8"}
        backing_density: {value: 0.5, unit: "1", source: assumed, bounds: [0.2, 1.5], note: "OPT 1.3 recommendation; removed in processing (spec D1 2.5.2); not fitted (spec D1 7.1)"}
