    number: J-78
    title: KODAK Developer D-76 (Technical Data / Chemicals)
    edition: December 2017 (back cover "Revised 12-17", © 2017 Kodak Alaris Inc.); 7 pages
    url: https://web.archive.org/web/20211017161519id_/https://imaging.kodakalaris.com/sites/default/files/files/resources/j78.pdf
    original_url: https://imaging.kodakalaris.com/sites/default/files/files/resources/j78.pdf
    retrieved: 2026-11-21 from the Wayback Machine capture of 2021-10-17 (the 2016 capture of the older imaging.kodakalaris.com/sites/prod/...
      path holds the © 2002 edition and was not used)
    pdf: .cache/datasheets/pdf/j78-2017-12.pdf
    sha256: d1998e9e3807bb8b4c1969ce44e5f9d7750f8043e5a19142a99b83eb546d9915
notes:
- 'no characteristic or contrast-index curves: every page was scanned for curve-like vector paths and embedded images
  and rendered; J-78 has tables and text only'
- J-78 names only older products (T-MAX 100 Professional, TRI-X Pan); their rows are kept with material null. TRI-X
  Pan Professional, T-MAX 400, T-MAX P3200 and other films are left out.
- J-78 prints no formula, mixing procedure, pH or contrast-index aim.
facts:
- id: film-rows-are-legacy-names
  value: null
  unit: null
  source: j78-2017-12
  page: 3-5
  where: every development-time table
  statement: J-78 (December 2017) names only the older products "T-MAX 100 Professional" and "TRI-X Pan" (with "TRI-X
    Pan Professional" for the 320-speed film). It has no row for KODAK PROFESSIONAL T-MAX 100 Film / 100TMX or KODAK
    PROFESSIONAL TRI-X 400 Film / 400TX. The rows below are therefore kept with material null. Their times do not
    match the current film publications (small tank, full strength, 20 C - J-78 T-MAX 100 Professional 9 min against
    F-4016 100TMX 6 1/2 min; J-78 TRI-X Pan 8 min against F-4017 400TX 6 3/4 min), so the film publications govern
    for the current films.
- id: contrast-aim
  value: null
  unit: '1'
  source: j78-2017-12
  page: '2'
  where: DEVELOPMENT TIMES, first paragraph
  statement: no contrast index aim is printed. The times are starting-point recommendations; if negatives are consistently
    too low in contrast increase the time by 10 to 15 percent, if too contrasty decrease it by 10 to 15 percent.
- id: contrast-adjustment-percent
  value: [10, 15]
  unit: percent
  source: j78-2017-12
  page: '2'
  where: DEVELOPMENT TIMES, first paragraph
  statement: increase or decrease the development time "slightly (10 to 15 percent)" when negatives are consistently
    too low or too high in contrast
- id: short-development-warning
  value: 5
  unit: min
  source: j78-2017-12
  page: '3'
  where: notes under the roll-film tables
  statement: tank development times shorter than 5 minutes may produce poor uniformity
- id: dilution-1-1-definition
  value: null
  unit: null
  source: j78-2017-12
  page: 2, 5
  where: DEVELOPMENT TIMES (p. 2); text under the storage table (p. 5)
  statement: J-78 writes only "Developer D-76 diluted 1:1"; it does not say in words which volumes the two numbers
    refer to. It says to dilute just before use, to check that no air bubbles are in the diluted solution, to discard
    it after processing the batch, and not to reuse or replenish it.
- id: dilution-1-1-minimum-volume
  value: 473
  unit: mL per 135-36 roll
  source: j78-2017-12
  page: '2'
  where: DEVELOPMENT TIMES, second paragraph
  statement: develop one 135-36 roll (80 square inches; the text prints "135-3 roll") in 473 mL (16 ounces) or two
    rolls together in 946 mL (one quart) of diluted developer. If one 135-36 roll is processed in a 237 mL (8-ounce)
    tank or two 135-36 rolls in a 473 mL (16-ounce) tank, increase the development time by 10 percent.
- id: dilution-1-1-two-rolls-16-ounce-tank
  value: 10
  unit: percent longer development
  source: j78-2017-12
  page: '5'
  where: text under the storage and capacity table
  statement: to extend the useful capacity of D-76 diluted 1:1 when processing two 36-exposure rolls in a 16-ounce
    tank, increase the recommended time by about 10 percent
- id: mixing-instructions
  value: null
  unit: null
  source: j78-2017-12
  page: '6'
  where: SIZES AVAILABLE
  statement: the December 2017 edition prints no mixing instructions and no formula. It lists packages "To make
    1 quart", "1/2 gallon", "1 gallon" and "10 gallons" of Developer D-76 (CAT 146 4791, 146 4809, 146 4817, 146
    4825) and "To make 1 gallon" of Replenisher D-76R (CAT 146 4833).
