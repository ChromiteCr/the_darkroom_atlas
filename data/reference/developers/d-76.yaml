- id: replenishment-standard
  value: [22.2, 29.6]
  unit: mL of Replenisher D-76R per 135-36 or 120 roll or 8 x 10-inch sheet (or equivalent)
  source: j78-2017-12
  page: '6'
  where: REPLENISHMENT, last paragraph
  statement: for films other than T-MAX Professional Films, replenish full-strength D-76 with Replenisher D-76R
    at 22.2 to 29.6 mL (3/4 to 1 fluid ounce) per roll or sheet, without increasing the development time; the rate
    usually covers carry-out and chemical depletion; make up larger losses with fresh working-strength developer;
    stir or recirculate after each addition
- id: replenishment-modified-for-t-max-films
  value: 70
  unit: mL of modified replenisher per 135-36 or 120 roll or 8 x 10-inch sheet (or equivalent)
  source: j78-2017-12
  page: '6'
  where: REPLENISHMENT, Using a Modified Replenisher
  statement: for KODAK T-MAX Professional Films mix Developer D-76 and Replenisher D-76R as packaged, then combine
    5 parts of Developer D-76 with 1 part of Replenisher D-76R (this avoids a small speed loss and a contrast increase
    as the developer seasons). Starting-point rate 70 mL (2 1/2 fluid ounces) per roll or sheet, adjusted with Black-and-White
    Film Process Control Strips. Do not store the mixed modified replenisher longer than 4 weeks; with low utilization
    (more than 1 month to turn over the tank) discard the developer after 1 month.
