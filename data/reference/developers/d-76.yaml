agitation:
- id: small-tank-rolls
  source: j78-2017-12
  page: '1'
  where: AGITATION, Agitating Rolls in a Small Tank
  applies_to: every "Small Tank" column (footnote "With agitation at 30-second intervals")
  interval_s: 30
  agitation_duration_s: 5
  cycles_per_agitation: 2 to 5, depending on the contrast needed and the type of tank
  initial_agitation: up to 5 cycles depending on results; for KODAK T-MAX Professional Films 5 to 7 cycles in 5
    seconds; the tank is then left to stand for the rest of the first 30 seconds
  cycle_definition: invertible tank - turn the tank upside down and back upright; non-invertible tank - slide it
    back and forth over 25.4 cm (10 inches); tanks with a reel-turning handle - rotate the reel back and forth through
    about one-half turn at one cycle per second
  procedure: fill the empty tank with developer; start the timer and drop the loaded reel in; attach the top and
    tap the tank bottom on the bench from about 2.5 cm (1 inch) to dislodge air bubbles; give the initial agitation
    (steps 2 to 4 take about 7 to 20 seconds); after the first 30 seconds agitate for 5 seconds at 30-second intervals
  note: the printed text reads "up to 5 cycle"
- id: large-tank-short-rolls
  source: j78-2017-12
  page: '1'
  where: AGITATION, Agitating Short Rolls in a Large Tank
  applies_to: every "Large Tank" roll-film column (footnote "With agitation at 1-minute intervals")
  interval_s: 60
  tank: typically 3.8 litres (1 gallon) or 13 litres (3 1/2 gallons); reels on a rack, basket or spindle (racks
    hold up to 30 rolls of 35 mm or 18 rolls of 120); rolls of 1.5 m (5 feet) or less
  initial_agitation: tap the rack sharply against the tank, then agitate continuously for the first 15 to 30 seconds
    by raising and lowering the rack about 1 cm (1/2 inch), keeping the reels submerged; no agitation for the rest
    of the first minute
  each_agitation: once each minute after the first, lift the rack completely out, tilt it about 30 degrees to drain
    for 5 to 10 seconds, reimmerse; alternate the tilt direction
- id: tray-sheets
  source: j78-2017-12
  page: '2'
  where: Agitating Sheet Film in a Tray
  applies_to: the sheet-film "Tray" columns (footnote "With continuous agitation")
  single_sheet: rock the tray to cover the sheet, then raise the left side about 1.9 cm (3/4 inch) and lower it,
    raise and lower the near side, the right side, the near side again; the cycle takes about 8 seconds; agitate
    continuously
  two_to_six_sheets: prewet in a tray of water at developer temperature, cycling the stack twice; then transfer
    the sheets one at a time emulsion up into the developer and interleave bottom to top continuously until development
    is complete
- id: large-tank-sheets
  source: j78-2017-12
  page: '2'
  where: Agitating Sheet Film in a Large Tank
  applies_to: the sheet-film "Large Tank" columns (footnote "With agitation at 1-minute intervals")
  interval_s: 60
  procedure: separate the hangers by at least 1 cm (1/2 inch); lower the hangers as a unit, tap them against the
    tank rim two or three times; leave them undisturbed for the rest of the first minute; then each minute lift
    all hangers out, tilt almost 90 degrees to the left, reimmerse, lift again and tilt almost 90 degrees to the
    right, reimmerse (about 5 to 7 seconds), and check the spacing
  note: the Note in the same column says each agitation cycle should take about 6 seconds
- id: rotary-tube
  source: j78-2017-12
  page: '5'
  where: Rotary-Tube Processing
  statement: follow the agitation recommendations for your processor (no interval or speed is given)
