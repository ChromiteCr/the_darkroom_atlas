# KODAK Developer D-76
#
# Development times, capacity, replenishment, mixing, storage and agitation facts, restricted to what
# concerns KODAK PROFESSIONAL TRI-X 400 (400TX, material kodak/tri-x-400) and
# KODAK PROFESSIONAL T-MAX 100 (100TMX, material kodak/t-max-100).
#
# Every block names its source (a key of `sources`, with edition, URL and sha256), the printed page and
# the table or passage. Times keep the printed text ("6¾", "4½†", "NR", "—") next to decimal minutes;
# NR (not recommended), "—" (no time given) and unreadable cells are null. Table cells were read from
# the PDF text layer with stacked fractions merged (tools/digitize/textrows.py) and checked cell by cell
# against the rendered pages. `bold` is kept only where the publication defines bold type. Rows with
# `material: null` name an older product and must not be attached to a current film. See
# data/reference/developers/README.md.
schema_version: 1
developer: d-76
name: KODAK Developer D-76
films:
  kodak/tri-x-400: KODAK PROFESSIONAL TRI-X 400 Film / 400TX
  kodak/t-max-100: KODAK PROFESSIONAL T-MAX 100 Film / 100TMX
