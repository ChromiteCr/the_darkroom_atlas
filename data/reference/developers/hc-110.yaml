  note: the table gives no time-compensation rule
- id: replenisher-preparation
  source: j24-2017-12
  page: '7'
  where: REPLENISHMENT, General; table PREPARING REPLENISHER SOLUTIONS
  statement: replenisher stock = the 16-ounce (473 mL) replenisher concentrate made up to 3.8 litres (1 gallon)
    with water; stored at 18 to 24 C for up to 6 months full or 2 months half-full
  working_replenisher:
  - {dilution: A, replenisher_stock_parts: '1', water_parts: none}
  - {dilution: B, replenisher_stock_parts: '2', water_parts: '1'}
  - {dilution: C, replenisher_stock_parts: '1', water_parts: none}
  - {dilution: D, replenisher_stock_parts: '1', water_parts: '1'}
  - {dilution: E, replenisher_stock_parts: '8', water_parts: '11'}
  - {dilution: F, replenisher_stock_parts: —, water_parts: —, note: dilution F is very dilute; replenishing it is
      not recommended}
- id: replenishment-rate
  value: 22
  unit: mL of replenisher solution per 8 x 10-inch sheet, 135-36 roll or 120 roll (or equivalent)
  source: j24-2017-12
  page: '7'
  where: Replenishment Rate
  statement: add 22 mL (3/4 fluid ounce) per sheet or roll and stir or recirculate; with an average 10-second drain
    into the stop bath this usually matches carry-out; raise the rate if negatives become thin or low in contrast,
    lower it if they become dense or contrasty; cover tanks with floating lids when idle
- id: replenished-tank-discard
  source: j24-2017-12
  page: '7'
  where: Process Control
  statement: with process control strips a tank solution can be used up to one month; without strips discard it
    after two weeks of replenishment, after adding replenisher equal to the original working volume, or after fifty
    20.3 x 25.4 cm sheets per litre (two hundred 8 x 10-inch sheets per gallon)
agitation:
- id: small-tank-rolls
  source: j24-2017-12
  page: '4'
  where: roll-film table column heading and footnote 1
  applies_to: roll-film "Small Tank" columns
  interval_s: 30
  statement: '"Manual Agitation at 30-Second Intervals"; footnote 1: development on a reel in a small roll-film
    tank. J-24 does not describe the motion, the number of inversions or the duration of each agitation.'
- id: large-tank-rolls
  source: j24-2017-12
  page: '4'
  where: roll-film table column heading and footnote 2
  applies_to: roll-film "Large Tank" columns
  interval_s: 60
  statement: '"Manual Agitation at 1-Minute Intervals"; footnote 2: development of several reels in a basket. The
    motion is not described.'
- id: tray-sheets
  source: j24-2017-12
  page: '3'
  where: sheet-film table column heading and footnote 1
  applies_to: sheet-film "Tray" columns
  statement: '"Continuous Agitation"; footnote 1: prewet the film in clean water at 20 C (68 F) for 1 to 2 minutes
    with agitation so that each sheet is thoroughly wet'
- id: large-tank-sheets
  source: j24-2017-12
  page: '3'
  where: sheet-film table column heading
  applies_to: sheet-film "Large Tank" columns
  interval_s: 60
  statement: '"Manual Agitation at 1-Minute Intervals"; the motion is not described'
- id: gaseous-burst
  source: j24-2017-12
  page: 3-4
  where: footnote 3 of the sheet and roll tables
  applies_to: only the rows marked with footnote 3 (EKTAPAN, Commercial, PLUS-X Pan Professional / PXT, TRI-X Pan
    Professional / TXT sheets; PLUS-X Pan Professional / PXP rolls) - none of the rows kept here
  burst_duration_s: 1
  interval_s: 10
  statement: the tray (sheet) or tank (roll) times also apply to gaseous-burst agitation with a 1-second burst every
    10 seconds at enough pressure to lift the solution level 16 mm (5/8 inch)
- id: rotary-tube
  source: j24-2017-12
  page: '6'
  where: rotary-tube table, footnote 1
  statement: development in a rotary-tube processor with continuous agitation (no speed or reversal interval is
    given)
