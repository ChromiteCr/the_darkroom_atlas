  - {dilution: D, tray_8x10_per_gallon: 8, tray_20x25cm_per_litre: 2, tank_unreplenished_8x10_per_gallon: 15, tank_unreplenished_20x25cm_per_litre: 4}
  - {dilution: E, tray_8x10_per_gallon: 5, tray_20x25cm_per_litre: 1.5, tank_unreplenished_8x10_per_gallon: 10,
    tank_unreplenished_20x25cm_per_litre: 3}
