# KODAK PROFESSIONAL HC-110 Developer
#
# Development times, capacity, replenishment, mixing, storage and agitation facts, restricted to what
# concerns KODAK PROFESSIONAL TRI-X 400 (400TX, material kodak/tri-x-400) and
# KODAK PROFESSIONAL T-MAX 100 (100TMX, material kodak/t-max-100).
#
# Every block names its source (a key of `sources`, with edition, URL and sha256), the printed page and
# the table or passage. Times keep the printed text ("6¾", "4½†", "NR", "—") next to decimal minutes;
# NR (not recommended), "—" (no time given) and unreadable cells are null. Table cells were read from
# the PDF text layer with stacked fractions merged (tools/digitize/textrows.py) and checked cell by cell
# against the rendered pages. `bold` is kept only where the publication defines bold type. Rows with
# `material: null` name an older product and must not be attached to a current film. See
# data/reference/developers/README.md.
schema_version: 1
developer: hc-110
name: KODAK PROFESSIONAL HC-110 Developer
films:
  kodak/tri-x-400: KODAK PROFESSIONAL TRI-X 400 Film / 400TX
  kodak/t-max-100: KODAK PROFESSIONAL T-MAX 100 Film / 100TMX
sources:
  j24-2017-12:
    publisher: Kodak Alaris
    number: J-24
    title: KODAK PROFESSIONAL HC-110 Developer (Technical Data / Chemicals)
    edition: December 2017 (back cover "Revised 12-17"); 8 pages
    url: https://kodakprofessional.com/sites/default/files/wysiwyg/pro/chemistry/j24.pdf
    pdf: .cache/datasheets/pdf/j24-2017-12.pdf
    sha256: e66818bc246a63db1f7667a703c32d9eeb9ea4cd4c73908f913023f2828171ce
notes:
- 'no characteristic or contrast-index curves: every page was scanned for curve-like vector paths and embedded images
  and rendered; J-24 has tables and text only'
- Only the current-product rows (PROFESSIONAL T-MAX 100; PROFESSIONAL TRI-X 400 Film / 400TX) are kept. The older-product
  rows T-MAX 100 Professional / TMX and TRI-X Pan / TX (dilutions A and B) are left out, as are TRI-X 320 / 320TXP
  and all other films. 400TX has no dilution A row.
- The P3200 tables (p. 5) and the graphic-arts table (p. 6) do not concern the two films.
facts:
- id: form
  value: highly concentrated liquid
  unit: null
  source: j24-2017-12
  page: '1'
  where: introduction
  statement: highly concentrated liquid developer for replenished and non-replenished systems, replenished with
    KODAK PROFESSIONAL HC-110 Developer Replenisher. No formula is published. Because of its viscosity, pour slowly,
    let it drain down the measure, measure small amounts to 0.5 mL (or with a syringe), rinse the measure at least
    five times into the mix, and mix for several minutes.
- id: stock-solution
  value: 1 part concentrate + 3 parts water
  unit: volume ratio
  source: j24-2017-12
  page: '1'
  where: PREPARING WORKING SOLUTIONS
  statement: to prepare stock solution, dilute one part concentrate with three parts water; mix stock or working
    solutions between 10 and 32 C (50 and 90 F); working solutions made from stock or from concentrate have the
    same photographic characteristics
- id: dilutions
  source: j24-2017-12
  page: '2'
  where: tables PREPARING WORKING SOLUTIONS FROM STOCK SOLUTION and ... FROM CONCENTRATE, last columns ("Ratio of
    Stock Solution to Water", "Ratio of Concentrate to Water")
  unit: parts stock (or concentrate) to parts water, by volume
  rows:
  - {dilution: A, stock_to_water: '1:3', concentrate_to_water: '1:15'}
  - {dilution: B, stock_to_water: '1:7', concentrate_to_water: '1:31'}
  - {dilution: C, stock_to_water: '1:4', concentrate_to_water: '1:19'}
  - {dilution: D, stock_to_water: '1:9', concentrate_to_water: '1:39'}
  - {dilution: E, stock_to_water: '1:11', concentrate_to_water: '1:47'}
  - {dilution: F, stock_to_water: '1:19', concentrate_to_water: '1:79'}
  example_dilution_b_1_litre: {from_stock: 125 mL stock + 875 mL water, from_concentrate: 31 mL concentrate + 969
      mL water}
  note: '"1:7" means one part stock to seven parts water (eight parts in all), as the volume columns show (for 1
    L, 125 mL + 875 mL). With stock = 1 part concentrate in 4, B from stock is 1 part concentrate in 32, the same
    as 1:31 from concentrate. The stock table prints "4.38 mL" of water for 5 L of B, and the concentrate table prints
    "313 L" of concentrate (beside 4687 mL of water) for 5 L of A and "828 L (28 fl oz)" of concentrate for 13.3 L of
    A; these look like misprints for 4.38 L, 313 mL and 828 mL and are not used.'
- id: concentrate-versions
  value: null
  unit: null
  source: j24-2017-12
  page: 1-8
  statement: the December 2017 edition describes a single concentrate and does not distinguish an older and a newer
    HC-110 concentrate; no such distinction is recorded here
- id: contrast-aim
  value: null
  unit: '1'
  source: j24-2017-12
  page: '3'
  where: DEVELOPMENT TIMES, first paragraph
  statement: no contrast-index number is printed. The times are meant to give negatives with contrast suitable for
    printing with a diffusion enlarger (or by contact) on normal-contrast paper; for a condenser enlarger decrease
    the time by approximately 30 percent.
- id: condenser-enlarger-reduction
  value: 30
  unit: percent shorter development
  source: j24-2017-12
  page: '3'
  where: DEVELOPMENT TIMES, first paragraph
  statement: decrease the development time by approximately 30 percent for printing with a condenser enlarger
- id: short-development-warning
  value: 5
  unit: min
  source: j24-2017-12
  page: 3-4
  where: footnote 2 of the sheet table; Note under the roll table
  statement: tank-development times shorter than 5 minutes may produce unsatisfactory uniformity
