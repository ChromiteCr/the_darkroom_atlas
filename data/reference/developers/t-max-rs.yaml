# KODAK PROFESSIONAL T-MAX RS Developer and Replenisher
#
# Development times, capacity, replenishment, mixing, storage and agitation facts, restricted to what
# concerns KODAK PROFESSIONAL TRI-X 400 (400TX, material kodak/tri-x-400) and
# KODAK PROFESSIONAL T-MAX 100 (100TMX, material kodak/t-max-100).
#
# Every block names its source (a key of `sources`, with edition, URL and sha256), the printed page and
# the table or passage. Times keep the printed text ("6¾", "4½†", "NR", "—") next to decimal minutes;
# NR (not recommended), "—" (no time given) and unreadable cells are null. Table cells were read from
# the PDF text layer with stacked fractions merged (tools/digitize/textrows.py) and checked cell by cell
# against the rendered pages. `bold` is kept only where the publication defines bold type. Rows with
# `material: null` name an older product and must not be attached to a current film. See
# data/reference/developers/README.md.
schema_version: 1
developer: t-max-rs
name: KODAK PROFESSIONAL T-MAX RS Developer and Replenisher
films:
  kodak/tri-x-400: KODAK PROFESSIONAL TRI-X 400 Film / 400TX
  kodak/t-max-100: KODAK PROFESSIONAL T-MAX 100 Film / 100TMX
sources:
  j86-2017-12:
    publisher: Kodak Alaris
    number: J-86
    title: KODAK PROFESSIONAL T-MAX Developers (Technical Data / Chemicals)
    edition: December 2017 (back cover "Revised 12-17"); 13 pages
    url: https://kodakprofessional.com/sites/default/files/wysiwyg/pro/chemistry/j86.pdf
    pdf: .cache/datasheets/pdf/j86-2017-12.pdf
    sha256: a20c0d249d04e8feaeb1240eca457f782f0e57dcd510e26e8a9b1c73bc13e00c
notes:
- 'no characteristic or contrast-index curves: every page was scanned for curve-like vector paths and embedded images
  and rendered; the only drawing is the wrist-twist agitation sketch on pp. 3 and 10'
- Only the PROFESSIONAL T-MAX 100 and PROFESSIONAL TRI-X 400 Film / 400TX rows are kept; the older-product rows
  (T-MAX 100 Professional, TRI-X Pan) and other films are left out.
facts:
- id: form
  value: two-part liquid concentrate
  unit: null
  source: j86-2017-12
  page: '1'
  where: introduction and FEATURES
  statement: hydroquinone-based two-part developer and replenisher formulated for replenished systems, usable unreplenished;
    the mixed solution is used as the working-tank solution and as its own replenisher; no starter is required.
    Sizes make 1 gallon and 10 gallons (two units of 5 gallons). J-86 gives no mixing ratio for the concentrates
    (the package instructions are referred to only implicitly) and no formula.
- id: replenishment-rate
  value: 45
  unit: mL of mixed solution per 135-36 or 120 roll or 8 x 10-inch sheet (or equivalent)
  source: j86-2017-12
  page: '2'
  where: REPLENISHMENT
  statement: add 1 1/2 fluid ounces (45 mL) per roll or sheet and stir or recirculate after each addition; do not
    use T-MAX RS to replenish T-MAX Developer
- id: process-control
  value: null
  unit: null
  source: j86-2017-12
  page: '2'
  where: PROCESS CONTROL
  statement: monitor with KODAK Black-and-White Film Process Control Strips (CAT 180 2990); the text prints "T-MAX
    1RS"
- id: storage-life
  source: j86-2017-12
  page: '2'
  where: STORAGE
  rows:
  - {solution: working-strength, container: full tightly closed bottle, printed: six months}
  - {solution: working-strength, container: half-filled bottle, printed: two months}
  - {solution: working-strength, container: covered tank, printed: one month}
  - {solution: concentrate, container: not stated, printed: up to two years}
- id: capacity-unreplenished
  value: null
  unit: null
  source: j86-2017-12
  page: 1-8
  statement: no unreplenished capacity or time-compensation rule is stated for T-MAX RS
- id: roller-transport
  value: null
  unit: null
  source: j86-2017-12
  page: '8'
  where: Note beside the rack-and-tank sheet table
  statement: do not use T-MAX RS in roller-transport processors
- id: contrast-aim
  value: 0.56
  unit: '1'
  source: j86-2017-12
  page: 2, 9
  where: PROCESSING
  statement: the development times are intended to produce a contrast index of 0.60 for KODAK PROFESSIONAL T-MAX
    400 Film and 0.56 for the other films, i.e. 0.56 for both T-MAX 100 and TRI-X 400; they suit printing with a
    diffusion enlarger
- id: condenser-enlarger-reduction
  value: [20, 30]
  unit: percent shorter development
  source: j86-2017-12
  page: 2, 9
  where: PROCESSING
  statement: for printing with a condenser enlarger reduce the development time by 20 to 30 percent
- id: bold-marking
  value: null
  unit: null
  source: j86-2017-12
  page: 3-11
  where: notes under every development-time table
  statement: the development times in bold type are suggested starting points. The bold flags in development_times
    rows were read from the font of each cell (WhitneyK-Semibold in the text layer) and checked on the rendered
    pages. No 400TX cell is bold in any J-86 table.
- id: short-development-warning
  value: 5
  unit: min
  source: j86-2017-12
  page: 3-5, 10
  where: dagger footnotes
  statement: development times shorter than 5 minutes may produce unsatisfactory uniformity (cells marked with a
    dagger)
- id: temperature-matching
  value: 1.7
  unit: C
  source: j86-2017-12
  page: '12'
  where: QUICK REFERENCE TO PROCESSING FILMS, Before Processing
  statement: keep all solution temperatures close to that of the developer; the tolerance prints as "?1.7°C [?3°F]"
    - the sign glyph is missing in both the text layer and the rendered page and is presumably a plus-minus sign
- id: working-solution-ph
  value: null
  unit: null
  source: j86-2017-12
  page: 1-13
  statement: not stated; no formula is published for either developer
agitation:
- id: small-tank-rolls
  source: j86-2017-12
  page: '3'
  where: MANUAL PROCESSING, Small-Tank Processing (8- or 16-ounce tank) - Rolls
  applies_to: the T-MAX RS small-tank table (p. 3)
  interval_s: 30
  initial_agitation: drop the loaded reel in, attach the top, tap the tank firmly on the bench, then 5 to 7 inversion
    cycles in 5 seconds (extend the arm and twist the wrist vigorously through 180 degrees, as drawn)
  each_agitation: the same procedure repeated at 30-second intervals for the rest of the development time
- id: large-tank-rolls
  source: j86-2017-12
  page: '4'
  where: Large-Tank Processing (1/2 to 3 1/2-gallon tank) - Rolls, Agitating Rolls in a Large Tank
  applies_to: the T-MAX RS large-tank roll table (p. 4)
  interval_s: 60
  initial_agitation: continuous for the first 15 to 30 seconds, raising and lowering the basket, rack or spindle
    1 cm (1/2 inch); none for the rest of the first minute
  each_agitation: once per minute lift the basket out, tilt it about 30 degrees, drain 5 to 10 seconds, reimmerse;
    alternate the tilt direction
- id: large-tank-sheets
  source: j86-2017-12
  page: '4'
  where: Agitating Sheet Film in a Large Tank
  applies_to: the T-MAX RS large-tank sheet table (p. 5)
  interval_s: 60
  procedure: hangers at least 1 cm (1/2 inch) apart; lower as a unit, tap on the rim two or three times; no agitation
    for the rest of the first minute; then each minute lift all hangers, tilt almost 90 degrees left, reimmerse,
    lift, tilt almost 90 degrees right, reimmerse (about 5 to 7 seconds), check spacing
- id: tray-sheets
  source: j86-2017-12
  page: '5'
  where: Tray Processing - Sheets
  applies_to: the T-MAX RS tray table (p. 5)
  statement: continuous agitation; rotate the sheets 90 degrees as you interleave them
- id: rotary-tube
  source: j86-2017-12
  page: '6'
  where: Rotary-Tube Processing - Rolls and Sheets
  statement: follow the agitation recommendations for your processor
- id: machine-rack-and-tank
  source: j86-2017-12
  page: '8'
  where: MACHINE PROCESSING, Large-Tank Rack-and-Tank Processing
  statement: times assume a machine that transfers the film every 2 minutes; footnote - development time depends
    on agitation and tank size
- id: quick-reference-small-tank
  source: j86-2017-12
  page: '12'
  where: QUICK REFERENCE TO PROCESSING FILMS, step 1 Developer
  tank: closed cylindrical container holding a single stack of spiral reels
  interval_s: 30
  cycles_per_agitation: about 4 inversion cycles (down, up) every 30 seconds; 5 cycles in 5 seconds for T-MAX Films
  cycle_duration_s: 1
  statement: first tap the tank to dislodge air bubbles; each inversion cycle takes about 1 second; a tank that
    cannot be inverted is slid back and forth in about a 10-inch arc for the same time
  note: the small-tank procedure printed above the tables (p. 3 and p. 10) gives 5 to 7 inversion cycles in 5 seconds,
    repeated at 30-second intervals; this quick reference gives about 4 cycles every 30 seconds (5 in 5 seconds
    for T-MAX Films). Both are recorded; they do not agree for non-T-MAX films such as 400TX.
- id: quick-reference-large-tank
  source: j86-2017-12
  page: '12'
  where: QUICK REFERENCE TO PROCESSING FILMS, step 1 Developer
  tank: open rectangular container usually used for sheet film
  interval_s: 60
  statement: tap the hangers against the top of the tank, then lift, tilt and drain the hangers over the tank 2
    times at 1-minute intervals, tilting right and then left
