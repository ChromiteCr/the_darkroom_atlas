  statement: no ISO speed is printed for 400TX. EI 1600 is labelled a 2-stop push and EI 3200 a 3-stop
    push (p. 6), and the rack-and-tank table gives normal times for TRI-X 400 at EI 400 and 800 (p. 7);
    both imply a normal exposure index of 400
