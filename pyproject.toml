[project]
name = "darkroom-atlas"
version = "0.0.0"
description = "Physically based simulation of film exposure, development and readout."
authors = [
    { name = "zgdhzad", email = "diankungao@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "array-api-compat>=1.16.0",
    "colour-science>=0.4.7",
    "imageio>=2.38.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tifffile>=2026.11.16",
    "typer>=0.29.2",
]

[project.scripts]
atlas = "darkroom_atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "array-api-strict>=2.6.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
