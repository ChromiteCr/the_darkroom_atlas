schema_version: 1
publication:
  publisher: Kodak Alaris
  number: F-4016
  title: KODAK PROFESSIONAL T-MAX 100 Film (Technical Data / Black-and-White Film)
  edition: June 2018 (p. 1 "June 2018"; back page "Revised 6-18")
  url: https://kodakprofessional.com/sites/default/files/wysiwyg/pro/resources/f4016_TMax_100.pdf
  file: f4016-2018-06.pdf
  sha256: 00518d7d1e296d6065f6e41ea3db999e5d8714679fb3d2b76d9a49eb207113be
page: 8
printed_page: "8"
figure: Characteristic Curves (bottom), KODAK PROFESSIONAL T-MAX 100 Film
caption: >-
  Exposure: Daylight. Process: KODAK PROFESSIONAL T-MAX Developer; Small Tank; 20°C (68°F).
  Densitometry: Diffuse Visual
material: kodak/t-max-100
method: vector
# Region: the white box around the chart (filled path #158).
region: [327.12, 61.98, 544.26, 276.06]
# Frame: the stroked rectangle, path #174.
frame: [355.81, 87.74, 540.25, 272.17]
# The legend box (path #163).
exclude:
  - [475.94, 105.19, 532.73, 146.02]
flatten_tolerance_pt: 0.01
decimals: [4, 4]
x:
  title: LOG EXPOSURE (lux-seconds)
  unit: log10(lux*s)
  side: bottom
  scale: linear
  bar_notation: true
  note: >-
    Labels -4 to -1 are printed in bar notation (bars drawn as paths #167, #173, #171,
    #168); the text layer reads them as 4.0, 3.0, 2.0, 1.0. -4 and +1 sit on the frame's
    left and right edges, the others on tick paths #172, #164, #165, #166.
  ticks:
    - {label: "4.0", bar: true, value: -4.0}
    - {label: "3.0", bar: true, value: -3.0}
    - {label: "2.0", bar: true, value: -2.0}
    - {label: "1.0", bar: true, value: -1.0}
    - {label: "0.0", value: 0.0}
    - {label: "1.0", value: 1.0}
y:
  title: DENSITY
  unit: "1"
  side: left
  scale: linear
  note: >-
    This chart's density axis runs 0 to 3.0, not 0 to 4.0 like the other two on the page.
    0.0 and 3.0 sit on the frame edges, 1.0 and 2.0 on tick paths #170 and #169.
  ticks:
    - {label: "0.0", value: 0.0}
    - {label: "1.0", value: 1.0}
    - {label: "2.0", value: 2.0}
    - {label: "3.0", value: 3.0}
curves:
  - output: char-tmax-dev-06min
    quantity: characteristic_curve
    legend: 6 min
    style: {width: 0.72, dash: [6.4777, 3.2388, 0.99964, 3.2388]}
    expect: {paths: 1, x_span: [-3.15, 0.65], tolerance: [0.01, 0.01]}
    conditions: &td
      developer: t-max-dev
      dilution: not stated in the figure
      time: 6min
      temperature: 20 C
      agitation: >-
        small tank (the caption gives no interval, the small-tank procedure on p. 2 agitates
        5 to 7 inversion cycles in 5 seconds at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
      exposure: daylight (no exposure time given)
  - output: char-tmax-dev-07min
    quantity: characteristic_curve
    legend: 7 min
    style: {width: 0.72, dash: [3.2388, 1.6194]}
    expect: {paths: 1, x_span: [-3.15, 0.65], tolerance: [0.01, 0.01]}
    conditions:
      <<: *td
      time: 7min
  - output: char-tmax-dev-10min
    quantity: characteristic_curve
    legend: 10 min
    style: {width: 0.72, dash: [6.4777, 3.2388]}
    expect: {paths: 1, x_span: [-3.15, 0.65], tolerance: [0.01, 0.01]}
    conditions:
      <<: *td
      time: 10min
      ci_cross_check: >-
        F-4016 disagrees with itself here. The contrast index read off this curve is 0.683,
        but the small-tank T-MAX contrast-index curve on p. 9 gives 0.640 at 10 min, 0.042
        lower. Every characteristic curve whose time lies within the span of its contrast-
        index curve reads 0.035 to 0.065 higher than that curve, well beyond the reading
        errors (CI +/-0.003, density +/-0.016), so the inconsistency is in F-4016 itself and
        a fit cannot match both figures closer than about 0.04 CI. Numbers from
        tools/digitize/contrast.py (collinear 0.2/2.2 construction centred on the density at
        the curve's left end)
  - output: char-tmax-dev-12min
    quantity: characteristic_curve
    legend: 12 min
    style: {width: 0.72, dash: []}
    drop_on_frame_edge: [top]
    drop_on_frame_edge_reason: &ceiling_reason >-
      the printed line runs into the top edge of the frame (density 3.0) near log exposure
      0.39 and stops there; that end vertex is where the line leaves the plotted range, not
      a reading
    expect: {paths: 1, x_span: [-3.15, 0.37], tolerance: [0.01, 0.01]}
    conditions:
      <<: *td
      time: 12min
      ci_cross_check: >-
        F-4016 disagrees with itself here. The contrast index read off this curve is 0.778,
        but the small-tank T-MAX contrast-index curve on p. 9 gives 0.713 at 12 min, 0.065
        lower. Every characteristic curve whose time lies within the span of its contrast-
        index curve reads 0.035 to 0.065 higher than that curve, well beyond the reading
        errors (CI +/-0.003, density +/-0.016), so the inconsistency is in F-4016 itself and
        a fit cannot match both figures closer than about 0.04 CI. Numbers from
        tools/digitize/contrast.py (collinear 0.2/2.2 construction centred on the density at
        the curve's left end)
      plot_ceiling: >-
        the curve leaves the chart through the top of the frame (density 3.0) near log
        exposure 0.39. The vertex where the line meets the frame edge is dropped, so the
        last point (log exposure 0.37, density 2.98) is the last vertex inside the frame,
        not the end of the measured curve
notes:
  - >-
    The 12-minute curve runs into the top edge of the frame (density 3.0); the published
    curve continues off the chart and is not available beyond that point. The vertex on the
    frame edge is dropped (drop_on_frame_edge); until 2026-11-21 it was kept as the last
    point (0.3873, 3.0001).
  - >-
    The 12-minute curve is a solid path of 18 operators (lines and Bezier curves); the
    other three are polylines of 136 points. The digitised points are the path vertices
    and the flattened Beziers, not measurements at those exposures.
  - >-
    The same figure is printed on p. 15 of the October 2007 combined F-4016 (KODAK
    PROFESSIONAL T-MAX Films); see recipes/f4016-2007-10.
