schema_version: 1
publication:
  publisher: Kodak Alaris
  number: F-4016
  title: KODAK PROFESSIONAL T-MAX 100 Film (Technical Data / Black-and-White Film)
  edition: June 2018 (p. 1 "June 2018"; back page "Revised 6-18")
  url: https://kodakprofessional.com/sites/default/files/wysiwyg/pro/resources/f4016_TMax_100.pdf
  file: f4016-2018-06.pdf
  sha256: 00518d7d1e296d6065f6e41ea3db999e5d8714679fb3d2b76d9a49eb207113be
page: 8
printed_page: "8"
figure: Characteristic Curves (middle), KODAK PROFESSIONAL T-MAX 100 Film
caption: >-
  Exposure: Daylight. Process: KODAK PROFESSIONAL T-MAX RS Developer and Replenisher;
  Large Tank; 20°C (68°F). Densitometry: Diffuse Visual
material: kodak/t-max-100
method: vector
# Region: the white box around the chart (filled path #132).
region: [325.56, 292.02, 542.64, 505.86]
# Frame: the stroked rectangle, path #149.
frame: [354.21, 317.80, 538.64, 502.30]
# The legend box (path #137).
exclude:
  - [362.92, 407.11, 427.62, 447.95]
flatten_tolerance_pt: 0.01
decimals: [4, 4]
x:
  title: LOG EXPOSURE (lux-seconds)
  unit: log10(lux*s)
  side: bottom
  scale: linear
  bar_notation: true
  note: >-
    Labels -4 to -1 are printed in bar notation (bars drawn as paths #141, #148, #146,
    #142); the text layer reads them as 4.0, 3.0, 2.0, 1.0. -4 and +1 sit on the frame's
    left and right edges, the others on tick paths #147, #138, #139, #140.
  ticks:
    - {label: "4.0", bar: true, value: -4.0}
    - {label: "3.0", bar: true, value: -3.0}
    - {label: "2.0", bar: true, value: -2.0}
    - {label: "1.0", bar: true, value: -1.0}
    - {label: "0.0", value: 0.0}
    - {label: "1.0", value: 1.0}
y:
  title: DENSITY
  unit: "1"
  side: left
  scale: linear
  note: 0.0 and 4.0 sit on the frame edges, 1.0-3.0 on tick paths #145, #143, #144.
  ticks:
    - {label: "0.0", value: 0.0}
    - {label: "1.0", value: 1.0}
    - {label: "2.0", value: 2.0}
    - {label: "3.0", value: 3.0}
    - {label: "4.0", value: 4.0}
curves:
  - output: char-tmax-rs-08min
    quantity: characteristic_curve
    legend: 8 min
    # "8 min" is right-aligned under the longer labels; its text starts 15.7 pt right of
    # the sample line's end.
    legend_max_gap_pt: 20
    style: {width: 0.72, dash: [6.4789, 3.2394, 0.99982, 3.2394]}
    expect: {paths: 1, x_span: [-3.17, 0.66], tolerance: [0.01, 0.01]}
    conditions: &rs
      developer: t-max-rs
      dilution: not stated in the figure (T-MAX RS Developer and Replenisher)
      time: 8min
      temperature: 20 C
      agitation: >-
        large tank (the caption gives no interval, the large-tank procedure on p. 3
        agitates once per minute after continuous agitation for the first 15 to 30 seconds)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
      exposure: daylight (no exposure time given)
  - output: char-tmax-rs-10.5min
    quantity: characteristic_curve
    legend: 10.5 min
    style: {width: 0.72, dash: [3.2394, 1.6197]}
    expect: {paths: 1, x_span: [-3.17, 0.66], tolerance: [0.01, 0.01]}
    conditions:
      <<: *rs
      time: 10.5min
      ci_cross_check: >-
        F-4016 disagrees with itself here. The contrast index read off this curve is 0.659,
        but the large-tank T-MAX RS contrast-index curve on p. 9 gives 0.614 at 10.5 min,
        0.045 lower. Every characteristic curve whose time lies within the span of its
        contrast-index curve reads 0.035 to 0.065 higher than that curve, well beyond the
        reading errors (CI +/-0.003, density +/-0.016), so the inconsistency is in F-4016
        itself and a fit cannot match both figures closer than about 0.04 CI. Numbers from
        tools/digitize/contrast.py (collinear 0.2/2.2 construction centred on the density at
        the curve's left end)
  - output: char-tmax-rs-13min
    quantity: characteristic_curve
    legend: 13 min
    style: {width: 0.72, dash: [6.4789, 3.2394]}
    expect: {paths: 1, x_span: [-3.17, 0.66], tolerance: [0.01, 0.01]}
    conditions:
      <<: *rs
      time: 13min
      ci_cross_check: >-
        F-4016 disagrees with itself here. The contrast index read off this curve is 0.736,
        but the large-tank T-MAX RS contrast-index curve on p. 9 gives 0.691 at 13 min,
        0.046 lower. Every characteristic curve whose time lies within the span of its
        contrast-index curve reads 0.035 to 0.065 higher than that curve, well beyond the
        reading errors (CI +/-0.003, density +/-0.016), so the inconsistency is in F-4016
        itself and a fit cannot match both figures closer than about 0.04 CI. Numbers from
        tools/digitize/contrast.py (collinear 0.2/2.2 construction centred on the density at
        the curve's left end)
  - output: char-tmax-rs-15min
    quantity: characteristic_curve
    legend: 15 min
    style: {width: 0.72, dash: []}
    expect: {paths: 1, x_span: [-3.17, 0.66], tolerance: [0.01, 0.01]}
    conditions:
      <<: *rs
      time: 15min
      ci_cross_check: >-
        F-4016 disagrees with itself here. The contrast index read off this curve is 0.795,
        but the large-tank T-MAX RS contrast-index curve on p. 9 gives 0.760 at 15 min,
        0.035 lower. Every characteristic curve whose time lies within the span of its
        contrast-index curve reads 0.035 to 0.065 higher than that curve, well beyond the
        reading errors (CI +/-0.003, density +/-0.016), so the inconsistency is in F-4016
        itself and a fit cannot match both figures closer than about 0.04 CI. Numbers from
        tools/digitize/contrast.py (collinear 0.2/2.2 construction centred on the density at
        the curve's left end)
notes:
  - >-
    The 15-minute curve is a solid path of 17 operators (lines and Bezier curves); the
    other three are polylines of 136 points. The digitised points are the path vertices
    and the flattened Beziers, not measurements at those exposures.
  - >-
    T-MAX RS curves exist only for large-tank processing; F-4016 prints no small-tank
    T-MAX RS characteristic curve.
  - >-
    The same figure is printed on p. 15 of the October 2007 combined F-4016 (KODAK
    PROFESSIONAL T-MAX Films); see recipes/f4016-2007-10.
