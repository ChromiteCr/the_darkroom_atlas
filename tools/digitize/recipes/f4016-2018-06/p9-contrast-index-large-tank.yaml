schema_version: 1
publication:
  publisher: Kodak Alaris
  number: F-4016
  title: KODAK PROFESSIONAL T-MAX 100 Film (Technical Data / Black-and-White Film)
  edition: June 2018 (p. 1 "June 2018"; back page "Revised 6-18")
  url: https://kodakprofessional.com/sites/default/files/wysiwyg/pro/resources/f4016_TMax_100.pdf
  file: f4016-2018-06.pdf
  sha256: 00518d7d1e296d6065f6e41ea3db999e5d8714679fb3d2b76d9a49eb207113be
page: 9
printed_page: "9 (unnumbered back page)"
figure: Contrast Index Curves (top right, Large Tank), KODAK PROFESSIONAL T-MAX 100 Film
caption: >-
  Process: Large Tank 68°F (20°C). Densitometry: Diffuse Visual
material: kodak/t-max-100
method: vector
# Region: the white box around the chart (filled path #79).
region: [326.94, 490.26, 544.32, 715.11]
# Frame: the stroked rectangle, path #89.
frame: [355.60, 516.03, 539.99, 700.50]
# The legend box (path #86).
exclude:
  - [467.27, 557.32, 535.74, 605.02]
flatten_tolerance_pt: 0.01
decimals: [4, 4]
x:
  title: DEVELOPMENT TIME (MINUTES)
  unit: min
  side: bottom
  scale: linear
  note: 4 and 18 sit on the frame edges, 6 to 16 on tick paths #94-#99.
  ticks:
    - {label: "4", value: 4}
    - {label: "6", value: 6}
    - {label: "8", value: 8}
    - {label: "10", value: 10}
    - {label: "12", value: 12}
    - {label: "14", value: 14}
    - {label: "16", value: 16}
    - {label: "18", value: 18}
y:
  title: CONTRAST INDEX
  unit: "1"
  side: left
  scale: linear
  note: 0.3 and 0.9 sit on the frame edges, 0.4 to 0.8 on tick paths #92, #93, #100-#102.
  ticks:
    - {label: "0.3", value: 0.3}
    - {label: "0.4", value: 0.4}
    - {label: "0.5", value: 0.5}
    - {label: "0.6", value: 0.6}
    - {label: "0.7", value: 0.7}
    - {label: "0.8", value: 0.8}
    - {label: "0.9", value: 0.9}
curves:
  - output: ci-large-tank-d76
    quantity: contrast_index
    legend: D-76
    style: {width: 0.72, dash: []}
    expect: {paths: 1, x_span: [7.1, 10.3], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: d-76
      dilution: stock
      temperature: 20 C
      agitation: large tank (the figure gives no interval, the large-tank procedure on p. 3 agitates once per minute after continuous agitation for the first 15 to 30 seconds)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-large-tank-tmax-rs
    quantity: contrast_index
    legend: T-MAX RS
    style: {width: 0.72, dash: [6.4777, 3.2388]}
    expect: {paths: 1, x_span: [8.7, 16.51], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: t-max-rs
      dilution: not stated in the figure
      temperature: 20 C
      agitation: large tank (the figure gives no interval, the large-tank procedure on p. 3 agitates once per minute after continuous agitation for the first 15 to 30 seconds)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-large-tank-xtol
    quantity: contrast_index
    legend: XTOL
    style: {width: 0.72, dash: [3.2388, 1.6194]}
    expect: {paths: 1, x_span: [8.2, 11.9], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: xtol
      dilution: stock
      temperature: 20 C
      agitation: large tank (the figure gives no interval, the large-tank procedure on p. 3 agitates once per minute after continuous agitation for the first 15 to 30 seconds)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-large-tank-hc110-b
    quantity: contrast_index
    legend: HC-110 (B)
    style: {width: 0.72, dash: [6.4777, 3.2388, 0.99964, 3.2388]}
    expect: {paths: 1, x_span: [6.6, 16.1], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: hc-110
      dilution: B (Kodak's dilution letter, the figure gives no ratio)
      temperature: 20 C
      agitation: large tank (the figure gives no interval, the large-tank procedure on p. 3 agitates once per minute after continuous agitation for the first 15 to 30 seconds)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
notes:
  - >-
    The curves are short polylines (3 to 8 vertices, plus one Bezier on the solid lines)
    and look drawn through a few test points; the digitised points are those vertices, not
    measurements at those times. Every curve runs from contrast index 0.56 to 0.82.
  - >-
    F-4016 (2018) never states its contrast aim. The CI 0.56 end of each curve agrees with
    the matching 20 C time table on pp. 3-4 to within about 0.2 min (see tables.yaml), and J-86
    p. 2 states that the T-MAX developer times aim at CI 0.56 for films other than
    T-MAX 400.
  - >-
    The same figure is printed on p. 16 of the October 2007 combined F-4016 (KODAK
    PROFESSIONAL T-MAX Films); see recipes/f4016-2007-10.
  - >-
    The figure does not say whether rolls or sheets were processed; the large-tank time
    tables on p. 3 are given separately for rolls and for sheets (equal for these four
    developers at 20 C, except that T-MAX Developer is not recommended for sheets).
  - >-
    The line styles differ from the small-tank chart: here D-76 is solid, T-MAX RS long
    dashes, XTOL short dashes and HC-110 (B) dash-dot.
