schema_version: 1
publication:
  publisher: Kodak Alaris
  number: F-4016
  title: KODAK PROFESSIONAL T-MAX 100 Film (Technical Data / Black-and-White Film)
  edition: June 2018 (p. 1 "June 2018"; back page "Revised 6-18")
  url: https://kodakprofessional.com/sites/default/files/wysiwyg/pro/resources/f4016_TMax_100.pdf
  file: f4016-2018-06.pdf
  sha256: 00518d7d1e296d6065f6e41ea3db999e5d8714679fb3d2b76d9a49eb207113be
page: 9
printed_page: "9 (unnumbered back page)"
figure: Contrast Index Curves (bottom left, Rotary Tube), KODAK PROFESSIONAL T-MAX 100 Film
caption: >-
  Process: Rotary Tube, 68°F (20°C). Densitometry: Diffuse Visual
material: kodak/t-max-100
method: vector
# Region: the white box around the chart (filled path #57).
region: [48.78, 248.52, 266.16, 469.65]
# Frame: the stroked rectangle, path #70.
frame: [77.44, 274.27, 261.84, 458.75]
# The legend box (path #71).
exclude:
  - [198.64, 314.42, 257.32, 348.89]
flatten_tolerance_pt: 0.01
decimals: [4, 4]
x:
  title: DEVELOPMENT TIME (MINUTES)
  unit: min
  side: bottom
  scale: linear
  note: 4 and 18 sit on the frame edges, 6 to 16 on tick paths #61-#66.
  ticks:
    - {label: "4", value: 4}
    - {label: "6", value: 6}
    - {label: "8", value: 8}
    - {label: "10", value: 10}
    - {label: "12", value: 12}
    - {label: "14", value: 14}
    - {label: "16", value: 16}
    - {label: "18", value: 18}
y:
  title: CONTRAST INDEX
  unit: "1"
  side: left
  scale: linear
  note: 0.3 and 0.9 sit on the frame edges, 0.4 to 0.8 on tick paths #58-#60, #67, #68.
  ticks:
    - {label: "0.3", value: 0.3}
    - {label: "0.4", value: 0.4}
    - {label: "0.5", value: 0.5}
    - {label: "0.6", value: 0.6}
    - {label: "0.7", value: 0.7}
    - {label: "0.8", value: 0.8}
    - {label: "0.9", value: 0.9}
curves:
  - output: ci-rotary-tube-xtol
    quantity: contrast_index
    legend: XTOL
    style: {width: 0.72, dash: []}
    expect: {paths: 1, x_span: [7.3, 10.6], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: xtol
      dilution: stock
      temperature: 20 C
      agitation: rotary tube (neither the figure nor F-4016 states the rotation)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-rotary-tube-xtol-1-1
    quantity: contrast_index
    legend: XTOL 1:1
    style: {width: 0.72, dash: [3.2388, 1.6194]}
    expect: {paths: 1, x_span: [9.7, 13.4], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: xtol
      dilution: 1+1 (printed 1:1)
      temperature: 20 C
      agitation: rotary tube (neither the figure nor F-4016 states the rotation)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
notes:
  - >-
    The curves are short polylines (3 to 8 vertices, plus one Bezier on the solid lines)
    and look drawn through a few test points; the digitised points are those vertices, not
    measurements at those times. Every curve runs from contrast index 0.56 to 0.82.
  - >-
    F-4016 (2018) never states its contrast aim. The CI 0.56 end of each curve agrees with
    the matching 20 C time table on pp. 3-4 to within about 0.2 min (see tables.yaml), and J-86
    p. 2 states that the T-MAX developer times aim at CI 0.56 for films other than
    T-MAX 400.
  - >-
    The same figure is printed on p. 16 of the October 2007 combined F-4016 (KODAK
    PROFESSIONAL T-MAX Films); see recipes/f4016-2007-10.
  - >-
    These two curves have the same end points as the small-tank XTOL and XTOL 1:1 curves
    on the same page (7.3 to 10.6 min and 9.7 to 13.4 min, CI 0.56 to 0.82) and follow
    them to within 0.05 min (the rotary-tube XTOL line is drawn as a Bezier, the
    small-tank one as a dash-dot polyline). They are kept as printed. Their CI 0.56 ends (7.3 and 9.7 min)
    agree with the rotary-tube rolls table on p. 4 (7 1/4 and 9 3/4 min at 20 C).
