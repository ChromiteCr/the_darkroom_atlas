schema_version: 1
publication:
  publisher: Kodak Alaris
  number: F-4016
  title: KODAK PROFESSIONAL T-MAX 100 Film (Technical Data / Black-and-White Film)
  edition: June 2018 (p. 1 "June 2018"; back page "Revised 6-18")
  url: https://kodakprofessional.com/sites/default/files/wysiwyg/pro/resources/f4016_TMax_100.pdf
  file: f4016-2018-06.pdf
  sha256: 00518d7d1e296d6065f6e41ea3db999e5d8714679fb3d2b76d9a49eb207113be
page: 9
printed_page: "9 (unnumbered back page)"
figure: Contrast Index Curves (top left, Small Tank), KODAK PROFESSIONAL T-MAX 100 Film
caption: >-
  Process: Small Tank, 68°F (20°C). Densitometry: Diffuse Visual
material: kodak/t-max-100
method: vector
# Region: the white box around the chart (filled path #24).
region: [48.78, 492.54, 266.16, 713.67]
# Frame: the stroked rectangle, path #40.
frame: [77.44, 518.28, 261.83, 702.76]
# The legend box (path #30).
exclude:
  - [181.48, 528.88, 256.44, 599.09]
flatten_tolerance_pt: 0.01
decimals: [4, 4]
x:
  title: DEVELOPMENT TIME (MINUTES)
  unit: min
  side: bottom
  scale: linear
  note: 4 and 18 sit on the frame edges, 6 to 16 on tick paths #45-#50.
  ticks:
    - {label: "4", value: 4}
    - {label: "6", value: 6}
    - {label: "8", value: 8}
    - {label: "10", value: 10}
    - {label: "12", value: 12}
    - {label: "14", value: 14}
    - {label: "16", value: 16}
    - {label: "18", value: 18}
y:
  title: CONTRAST INDEX
  unit: "1"
  side: left
  scale: linear
  note: 0.3 and 0.9 sit on the frame edges, 0.4 to 0.8 on tick paths #43, #44, #51-#53.
  ticks:
    - {label: "0.3", value: 0.3}
    - {label: "0.4", value: 0.4}
    - {label: "0.5", value: 0.5}
    - {label: "0.6", value: 0.6}
    - {label: "0.7", value: 0.7}
    - {label: "0.8", value: 0.8}
    - {label: "0.9", value: 0.9}
# Seven curves told apart by width and dash, each checked against its legend sample.
# D-76 (1:1) and XTOL 1:1 are the only 1.08-pt lines (solid and dashed); D-76 shares
# XTOL 1:1's dash array at 0.72 pt. The time spans agree with docs/research/d1/datasheets.md
# section 3.1.
curves:
  - output: ci-small-tank-d76
    quantity: contrast_index
    legend: D-76
    style: {width: 0.72, dash: [6.4777, 3.2388]}
    expect: {paths: 1, x_span: [6.3, 9.1], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: d-76
      dilution: stock
      temperature: 20 C
      agitation: small tank (the figure gives no interval, the small-tank procedure on p. 2 agitates at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-small-tank-d76-1-1
    quantity: contrast_index
    legend: D-76, (1:1)
    style: {width: 1.08, dash: []}
    expect: {paths: 1, x_span: [9.4, 13.3], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: d-76
      dilution: 1+1 (printed 1:1)
      temperature: 20 C
      agitation: small tank (the figure gives no interval, the small-tank procedure on p. 2 agitates at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-small-tank-tmax-dev
    quantity: contrast_index
    legend: T-MAX
    style: {width: 0.72, dash: []}
    expect: {paths: 1, x_span: [7.7, 14.5], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: t-max-dev
      dilution: not stated in the figure
      temperature: 20 C
      agitation: small tank (the figure gives no interval, the small-tank procedure on p. 2 agitates at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-small-tank-tmax-rs
    quantity: contrast_index
    legend: T-MAX RS
    style: {width: 0.72, dash: [3.2388, 1.6194]}
    expect: {paths: 1, x_span: [7.8, 14.6], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: t-max-rs
      dilution: not stated in the figure
      temperature: 20 C
      agitation: small tank (the figure gives no interval, the small-tank procedure on p. 2 agitates at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-small-tank-xtol
    quantity: contrast_index
    legend: XTOL
    style: {width: 0.72, dash: [6.4777, 3.2388, 0.99964, 3.2388]}
    expect: {paths: 1, x_span: [7.3, 10.6], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: xtol
      dilution: stock
      temperature: 20 C
      agitation: small tank (the figure gives no interval, the small-tank procedure on p. 2 agitates at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-small-tank-xtol-1-1
    quantity: contrast_index
    legend: XTOL 1:1
    style: {width: 1.08, dash: [6.4777, 3.2388]}
    expect: {paths: 1, x_span: [9.7, 13.4], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: xtol
      dilution: 1+1 (printed 1:1)
      temperature: 20 C
      agitation: small tank (the figure gives no interval, the small-tank procedure on p. 2 agitates at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
  - output: ci-small-tank-hc110-b
    quantity: contrast_index
    legend: HC-110 (B)
    style: {width: 0.72, dash: [16.194, 3.2388, 3.2388, 3.2388, 3.2388, 3.2388]}
    expect: {paths: 1, x_span: [5.9, 14.3], y_span: [0.56, 0.82], tolerance: [0.03, 0.005]}
    conditions:
      developer: hc-110
      dilution: B (Kodak's dilution letter, the figure gives no ratio)
      temperature: 20 C
      agitation: small tank (the figure gives no interval, the small-tank procedure on p. 2 agitates at 30-second intervals)
      format: not stated (the figure is not split by format)
      densitometry: diffuse visual
notes:
  - >-
    The curves are short polylines (3 to 8 vertices, plus one Bezier on the solid lines)
    and look drawn through a few test points; the digitised points are those vertices, not
    measurements at those times. Every curve runs from contrast index 0.56 to 0.82.
  - >-
    F-4016 (2018) never states its contrast aim. The CI 0.56 end of each curve agrees with
    the matching 20 C time table on pp. 3-4 to within about 0.2 min (see tables.yaml), and J-86
    p. 2 states that the T-MAX developer times aim at CI 0.56 for films other than
    T-MAX 400.
  - >-
    The same figure is printed on p. 16 of the October 2007 combined F-4016 (KODAK
    PROFESSIONAL T-MAX Films); see recipes/f4016-2007-10.
  - >-
    The legend prints "D-76, (1:1)" with a comma; the recipe quotes it as printed.
