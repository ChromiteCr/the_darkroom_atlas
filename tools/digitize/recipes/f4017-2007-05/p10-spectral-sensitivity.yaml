# Cross-check recipe, generated from f4017-2021-10/p8-spectral-sensitivity.yaml with this
# edition's page, frame and legend box. It stages nothing.
schema_version: 1
publication:
  publisher: Eastman Kodak Company
  number: F-4017
  title: KODAK PROFESSIONAL TRI-X 320 and 400 Films (Technical Data / Black-and-White Film)
  edition: May 2007
  url: https://web.archive.org/web/20090205030656id_/http://www.kodak.com:80/global/en/professional/support/techPubs/f4017/f4017.pdf
  file: f4017-2007-05.pdf
  sha256: b2a9a1cabe2520630f7135563791290953892224a0b785aa2c3a5394a566be2d
page: 10
printed_page: '10'
figure: Spectral Sensitivity Curves
caption: 'Effective Exposure: 0.5 sec. Densitometry: Diffuse Visual. Footnote: *Sensitivity = reciprocal
  of exposure (erg/cm2) required to produce specified density'
material: kodak/tri-x-400
method: vector
region:
- 316.72
- 240.44
- 556.72
- 454.16
frame:
- 349.66
- 296.49
- 550.09
- 447.8
exclude:
- - 357.78
  - 304.9
  - 444.67
  - 328.33
flatten_tolerance_pt: 0.01
decimals:
- 4
- 4
x:
  title: WAVELENGTH (nm)
  unit: nm
  side: bottom
  scale: linear
  note: '250 sits on the frame''s left edge and 300-700 on grid lines (20.08-20.09 pt per 50 nm).
    The 750 label is left out: it is half covered by the page''s white border in the rendering, and
    the frame''s right edge where it sits is 0.44 pt short of where the grid spacing puts 750 nm.'
  ticks:
  - label: '250'
    value: 250
  - label: '300'
    value: 300
  - label: '350'
    value: 350
  - label: '400'
    value: 400
  - label: '450'
    value: 450
  - label: '500'
    value: 500
  - label: '550'
    value: 550
  - label: '600'
    value: 600
  - label: '650'
    value: 650
  - label: '700'
    value: 700
y:
  title: LOG SENSITIVITY*
  unit: log10(cm2/erg)
  side: left
  scale: linear
  note: Log10 of sensitivity, where sensitivity is the reciprocal of the exposure in erg/cm2 needed
    for the stated density; 0.0 and 4.0 sit on the frame edges, 1.0-3.0 on grid lines.
  ticks:
  - label: '0.0'
    value: 0.0
  - label: '1.0'
    value: 1.0
  - label: '2.0'
    value: 2.0
  - label: '3.0'
    value: 3.0
  - label: '4.0'
    value: 4.0
curves:
  # The printed legend is swapped (see legend_check): the solid line is the 0.3 curve and
  # the dashed line the 1.0 curve. `legend` still names the printed entry whose sample
  # selects each line, so the style check against the legend samples keeps working.
  - output: spectral-sensitivity-d0.3
    quantity: spectral_sensitivity
    legend: D=1.0>Gross Fog
    legend_reassigned: >-
      assigned to density 0.3 above gross fog, not 1.0 as printed, because the printed
      legend is swapped (see the legend_check condition)
    style: {width: 0.719, dash: []}
    drop_on_frame_edge: [bottom]
    drop_on_frame_edge_reason: &floor_reason >-
      the printed line runs into the bottom edge of the frame (log sensitivity 0.0) and
      stops there; that end vertex is where the line leaves the plotted range, not a reading
    expect: {paths: 1, x_span: [300.0, 664.0], tolerance: [1.0, 0.05]}
    conditions: &spectral
      criterion: >-
        density 0.3 above gross fog (the solid, upper line, which the printed legend
        labels as the 1.0 curve, see legend_check)
      exposure: effective exposure 0.5 s
      developer: not stated in the figure
      densitometry: diffuse visual
      film_version: >-
        older TRI-X Pan Film 5063 per F-4017 May 2007 p. 10 (later editions drop the note
        but print the same figure)
      legend_check: >-
        the printed legend gives the solid, upper line to density 1.0 above gross fog and
        the dashed, lower line to 0.3. That cannot be right. Sensitivity is the reciprocal
        of the exposure needed to reach the criterion density, and a lower density needs
        less exposure, so the 0.3 curve must lie above the 1.0 curve at every wavelength.
        The solid line lies above the dashed one everywhere it is plotted, by 1.0 to 1.3
        log units from 300 to 630 nm. F-4016 (T-MAX 100, June 2018) p. 8 prints its 0.3
        curve above its 1.0 curve. The February 2016 and May 2007 editions of F-4017 print
        the same legend. The files are therefore assigned by this physical constraint,
        against the printed legend
      plot_floor: >-
        both printed lines run into the bottom edge of the frame (log sensitivity 0.0),
        the dashed one near 656 nm and the solid one near 668 nm. That end vertex marks
        where the line leaves the plotted range and is dropped. The last kept point ends
        the steep fall towards the frame edge (the 0.3 curve at 664.0 nm, the 1.0 curve
        at 655.3 nm)
  - output: spectral-sensitivity-d1.0
    quantity: spectral_sensitivity
    legend: D=0.3>Gross Fog
    legend_reassigned: >-
      assigned to density 1.0 above gross fog, not 0.3 as printed, because the printed
      legend is swapped (see the legend_check condition)
    style: {width: 0.719, dash: [3.2375, 1.6188]}
    drop_on_frame_edge: [bottom]
    drop_on_frame_edge_reason: *floor_reason
    expect: {paths: 1, x_span: [300.0, 655.3], tolerance: [1.0, 0.05]}
    conditions:
      <<: *spectral
      criterion: >-
        density 1.0 above gross fog (the dashed, lower line, which the printed legend
        labels as the 0.3 curve, see legend_check)
notes:
- 'Cross-check: the same figure in the May 2007 edition (kodak.com copy archived by the Wayback Machine).
  Its curves were drawn as separate polylines, so small differences from the 2021 paths are expected.'
cross_check_of: tools/digitize/recipes/f4017-2021-10/p8-spectral-sensitivity.yaml
max_difference:
- 0.005
- 0.005
