    The printed grid is not an exact logarithmic scale: decade lengths differ by up to
    about 1.5 pt (1 to 10: 71.7 pt; 10 to 100: 73.2 pt), and the 600 label sits on the frame
    edge about 2 pt right of where the 100-200 spacing puts 600. The curve is read piecewise
    between neighbouring labelled grid lines; the least-squares residual of a single log
    scale is reported and included in the error.
