schema_version: 1
publication:
  publisher: Kodak Alaris
  number: F-4017
  title: KODAK PROFESSIONAL TRI-X 320 and 400 Films (Technical Data / Black-and-White Film)
  edition: October 2021 (back cover "Revised 10-21")
  url: https://kodakprofessional.com/sites/default/files/wysiwyg/film/f4017_trix_320400.pdf
  file: f4017-2021-10.pdf
  sha256: 1d86b030cf7a8502e6f1414c630fa2cda30b68df53f49bccccce73c9c6562078
page: 8
printed_page: "8"
figure: Spectral Sensitivity Curves
caption: >-
  Effective Exposure: 0.5 sec. Densitometry: Diffuse Visual. Footnote: *Sensitivity =
  reciprocal of exposure (erg/cm2) required to produce specified density
material: kodak/tri-x-400
method: vector
# Region: the white box around the chart (filled paths #92-#95).
region: [42.0, 292.98, 282.0, 506.7]
# Frame: the stroked rectangle, path #61.
frame: [74.94, 349.03, 275.37, 500.33]
# The legend box (path #76).
exclude:
  - [83.06, 357.43, 169.96, 380.86]
flatten_tolerance_pt: 0.01
decimals: [4, 4]
x:
  title: WAVELENGTH (nm)
  unit: nm
  side: bottom
  scale: linear
  note: >-
    250 sits on the frame's left edge and 300-700 on grid lines (20.08-20.09 pt per 50 nm).
    The 750 label is left out: it is half covered by the page's white border in the
    rendering, and the frame's right edge where it sits is 0.44 pt short of where the grid
    spacing puts 750 nm.
  ticks:
    - {label: "250", value: 250}
    - {label: "300", value: 300}
    - {label: "350", value: 350}
    - {label: "400", value: 400}
    - {label: "450", value: 450}
    - {label: "500", value: 500}
    - {label: "550", value: 550}
    - {label: "600", value: 600}
    - {label: "650", value: 650}
    - {label: "700", value: 700}
y:
  title: LOG SENSITIVITY*
  unit: log10(cm2/erg)
  side: left
  scale: linear
  note: >-
    Log10 of sensitivity, where sensitivity is the reciprocal of the exposure in erg/cm2
    needed for the stated density; 0.0 and 4.0 sit on the frame edges, 1.0-3.0 on grid lines.
  ticks:
    - {label: "0.0", value: 0.0}
    - {label: "1.0", value: 1.0}
    - {label: "2.0", value: 2.0}
    - {label: "3.0", value: 3.0}
    - {label: "4.0", value: 4.0}
curves:
  # The printed legend is swapped (see legend_check): the solid line is the 0.3 curve and
  # the dashed line the 1.0 curve. `legend` still names the printed entry whose sample
  # selects each line, so the style check against the legend samples keeps working.
  - output: spectral-sensitivity-d0.3
    quantity: spectral_sensitivity
    legend: D=1.0>Gross Fog
    legend_reassigned: >-
      assigned to density 0.3 above gross fog, not 1.0 as printed, because the printed
      legend is swapped (see the legend_check condition)
    style: {width: 0.719, dash: []}
    drop_on_frame_edge: [bottom]
    drop_on_frame_edge_reason: &floor_reason >-
      the printed line runs into the bottom edge of the frame (log sensitivity 0.0) and
      stops there; that end vertex is where the line leaves the plotted range, not a reading
    expect: {paths: 1, x_span: [300.0, 664.0], tolerance: [1.0, 0.05]}
    conditions: &spectral
      criterion: >-
        density 0.3 above gross fog (the solid, upper line, which the printed legend
        labels as the 1.0 curve, see legend_check)
      exposure: effective exposure 0.5 s
      developer: not stated in the figure
      densitometry: diffuse visual
      film_version: >-
        older TRI-X Pan Film 5063 per F-4017 May 2007 p. 10 (later editions drop the note
        but print the same figure)
      legend_check: >-
        the printed legend gives the solid, upper line to density 1.0 above gross fog and
        the dashed, lower line to 0.3. That cannot be right. Sensitivity is the reciprocal
        of the exposure needed to reach the criterion density, and a lower density needs
        less exposure, so the 0.3 curve must lie above the 1.0 curve at every wavelength.
        The solid line lies above the dashed one everywhere it is plotted, by 1.0 to 1.3
        log units from 300 to 630 nm. F-4016 (T-MAX 100, June 2018) p. 8 prints its 0.3
        curve above its 1.0 curve. The February 2016 and May 2007 editions of F-4017 print
        the same legend. The files are therefore assigned by this physical constraint,
        against the printed legend
      plot_floor: >-
        both printed lines run into the bottom edge of the frame (log sensitivity 0.0),
        the dashed one near 656 nm and the solid one near 668 nm. That end vertex marks
        where the line leaves the plotted range and is dropped. The last kept point ends
        the steep fall towards the frame edge (the 0.3 curve at 664.0 nm, the 1.0 curve
        at 655.3 nm)
  - output: spectral-sensitivity-d1.0
    quantity: spectral_sensitivity
    legend: D=0.3>Gross Fog
    legend_reassigned: >-
      assigned to density 1.0 above gross fog, not 0.3 as printed, because the printed
      legend is swapped (see the legend_check condition)
    style: {width: 0.719, dash: [3.2375, 1.6188]}
    drop_on_frame_edge: [bottom]
    drop_on_frame_edge_reason: *floor_reason
    expect: {paths: 1, x_span: [300.0, 655.3], tolerance: [1.0, 0.05]}
    conditions:
      <<: *spectral
      criterion: >-
        density 1.0 above gross fog (the dashed, lower line, which the printed legend
        labels as the 0.3 curve, see legend_check)
notes:
  - >-
    Cross-checked against the same figure on p. 7 of the February 2016 edition
    (recipes/f4017-2016-02, within 0.0001, which is rounding) and on p. 10 of the May 2007
    edition (recipes/f4017-2007-05, within 0.005).
  - >-
    Legend error in the publication, corrected here: the line the legend labels D=1.0
    (solid) lies 1.0 to 1.3 log units above the one labelled D=0.3 (dashed) from 300 to
    630 nm. Reaching density 1.0 above fog takes more exposure than reaching 0.3, so the
    1.0 curve must be the lower one; F-4016 (Revised 6-18) p. 8 prints its 0.3 curve above
    its 1.0 curve. The solid line is staged as spectral-sensitivity-d0.3 and the dashed
    line as spectral-sensitivity-d1.0 (legend_reassigned). Until 2026-11-21 the files
    followed the printed legend.
  - >-
    Both lines end where they run into the bottom of the frame (log sensitivity 0.0), near
    656 nm (dashed) and 668 nm (solid). That end vertex is dropped (drop_on_frame_edge);
    the vertex before it, inside the frame, is kept as the last reading.
  - >-
    F-4017 May 2007 (kodak.com copy archived at web.archive.org, p. 10) states that the
    Modulation Transfer Function and Spectral Sensitivity "were generated using the older
    version of this film (KODAK TRI-X Pan Fim 5063)".
