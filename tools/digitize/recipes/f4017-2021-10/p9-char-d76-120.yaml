schema_version: 1
publication:
  publisher: Kodak Alaris
  number: F-4017
  title: KODAK PROFESSIONAL TRI-X 320 and 400 Films (Technical Data / Black-and-White Film)
  edition: October 2021 (back cover "Revised 10-21")
  url: https://kodakprofessional.com/sites/default/files/wysiwyg/film/f4017_trix_320400.pdf
  file: f4017-2021-10.pdf
  sha256: 1d86b030cf7a8502e6f1414c630fa2cda30b68df53f49bccccce73c9c6562078
page: 9
printed_page: "9"
figure: Characteristic Curves, KODAK PROFESSIONAL TRI-X 400 Film / 400TX, 120-size
caption: >-
  Process: KODAK PROFESSIONAL D-76 Developer, Large Tank; Agitation at 1 minute intervals;
  20°C (68°F). Densitometry: Diffuse visual
material: kodak/tri-x-400
method: vector
# Region: the white box FrameMaker draws around the chart (filled paths #52-#55).
region: [54.0, 232.98, 294.0, 472.98]
# Frame: the stroked rectangle, path #30.
frame: [93.4, 273.18, 277.84, 457.67]
# The legend box (path #47); nothing inside it is a curve.
exclude:
  - [102.82, 364.37, 185.9, 401.11]
flatten_tolerance_pt: 0.01
decimals: [4, 4]
x:
  title: LOG EXPOSURE (lux-seconds)
  unit: log10(lux*s)
  side: bottom
  scale: linear
  bar_notation: true
  note: >-
    Labels -4 to -1 are printed in bar notation (a bar over the characteristic, drawn as
    short horizontal paths); the text layer reads them as 4.0, 3.0, 2.0, 1.0. -4 and +1 sit
    on the frame's left and right edges, the others on tick paths.
  ticks:
    - {label: "4.0", bar: true, value: -4.0}
    - {label: "3.0", bar: true, value: -3.0}
    - {label: "2.0", bar: true, value: -2.0}
    - {label: "1.0", bar: true, value: -1.0}
    - {label: "0.0", value: 0.0}
    - {label: "1.0", value: 1.0}
y:
  title: DENSITY
  unit: "1"
  side: left
  scale: linear
  ticks:
    - {label: "0.0", value: 0.0}
    - {label: "1.0", value: 1.0}
    - {label: "2.0", value: 2.0}
    - {label: "3.0", value: 3.0}
    - {label: "4.0", value: 4.0}
curves:
  - output: char-120-d76-06min
    quantity: characteristic_curve
    legend: 6 minutes
    style: {width: 0.72, dash: []}
    expect: {paths: 1, x_span: [-3.45, 0.35], tolerance: [0.01, 0.01]}
    conditions: &cond
      developer: d-76
      dilution: stock (the figure names no dilution)
      time: 6min
      temperature: 20 C
      agitation: large tank, agitation at 1 minute intervals
      format: 120-size
      densitometry: diffuse visual
      exposure: not stated (no illuminant or exposure time given)
  - output: char-120-d76-08min
    quantity: characteristic_curve
    legend: 8 minutes
    style: {width: 0.72, dash: [3.2394, 1.6197]}
    expect: {paths: 1, x_span: [-3.45, 0.35], tolerance: [0.01, 0.01]}
    conditions:
      <<: *cond
      time: 8min
  - output: char-120-d76-10min
    quantity: characteristic_curve
    legend: 10 minutes
    style: {width: 0.72, dash: [6.4789, 3.2394]}
    expect: {paths: 1, x_span: [-3.45, 0.35], tolerance: [0.01, 0.01]}
    conditions:
      <<: *cond
      time: 10min
  - output: char-120-d76-12min
    quantity: characteristic_curve
    legend: 12 minutes
    style: {width: 0.72, dash: [16.197, 3.2394, 3.2394, 3.2394, 3.2394, 3.2394]}
    expect: {paths: 1, x_span: [-3.45, 0.35], tolerance: [0.01, 0.01]}
    conditions:
      <<: *cond
      time: 12min
notes:
  - >-
    Cross-checked against the same figure on p. 8 of the February 2016 edition
    (recipes/f4017-2016-02, within 0.0001, which is rounding) and on p. 12 of the May 2007
    edition (recipes/f4017-2007-05, within 0.005).
  - >-
    Not to be confused with the HC-110 (Dilution B) and D-76 characteristic curves on pp. 9-10
    of this edition that are labelled TRI-X 320 Film / 320TXP, Sheets: those are a different
    film and are not digitised here.
