# KODAK PROFESSIONAL T-MAX 100 Film (100TMX): facts that are tables or single numbers.
#
# Every block names its source (a key of `sources`, with edition, URL and sha256), the page as
# printed and the table or passage. Times are kept as printed ("6¾", "NR", "—", with footnote
# marks *, † and ‡ left on the cell) next to their decimal reading in minutes; NR (not
# recommended) and "—" (no time given) are null, never numbers. F-4016 cells were read from the
# PDF text layer (where 6¾ is encoded as "63⁄4") and checked against the rendered pages; the
# J-109 rows were read from the rendered page. F-4016 states no contrast-index aim: see
# `contrast_aim` in each table.
