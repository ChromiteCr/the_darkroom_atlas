facts:
- id: exposure-index
  value: 100
  unit: '1'
  source: f4016-2018-06
  page: '1'
  where: EXPOSURE, first paragraph
  statement: The nominal speed of KODAK PROFESSIONAL T-MAX 100 Film is EI 100. It was determined in a
    manner published in ISO standards.
- id: iso-speed
  value: 100
  unit: '1'
  printed: ISO 100/21° in most developers
  source: f4016-2018-06
  page: '1'
  where: introduction
  statement: medium speed (ISO 100/21° in most developers)
- id: processing-aim
  value: null
  unit: null
  source: f4016-2018-06
  page: '2'
  where: PROCESSING, first paragraph
  statement: These starting-point recommendations are intended to produce negatives with a contrast appropriate
    for printing with a diffusion enlarger. F-4016 gives no contrast-index number; to print with a condenser
    enlarger, shorten development.
- id: t-max-developers-contrast-aim
  value: 0.56
  unit: '1'
  source: j86-2017-12
  page: '2'
  statement: J-86 development times aim at a contrast index of 0.60 for T-MAX 400 Film and 0.56 for the
    other films (so 0.56 for T-MAX 100 in T-MAX and T-MAX RS developers)
- id: short-development-warning
  value: 5
  unit: min
  source: f4016-2018-06
  page: '2'
  where: PROCESSING, first paragraph
  statement: Tank development times shorter than 5 minutes may produce unsatisfactory uniformity.
- id: development-adjustment-advice
  value: [10, 15]
  unit: '%'
  source: f4016-2018-06
  page: '1'
  where: EXPOSURE, third paragraph
  statement: If normal development gives negatives consistently too low in contrast, increase the development
    time slightly (10 to 15 percent); if too contrasty, decrease it slightly (10 to 15 percent).
- id: rms-granularity
  value: 8
  unit: '1'
  printed: '8'
  source: f4016-2018-06
  page: '8'
  where: IMAGE STRUCTURE table, row T-MAX 100, column Diffuse rms Granularity
  measurement: read at a net diffuse density of 1.00, using a 48-micrometre aperture, 12X magnification
    (table footnote)
  development: KODAK Developer D-76, 68 F (20 C); time and tank not stated
  cross_check: same value (8) in F-4016 October 2007, p. 13
- id: resolving-power-toc-1.6
  value: 63
  unit: lines/mm
  printed: 63 lines/mm (TOC 1.6:1)
  source: f4016-2018-06
  page: '8'
  where: IMAGE STRUCTURE table, row T-MAX 100, column Resolving Power
  measurement: test-object contrast 1.6:1; determined according to a method similar to the one described
    in ISO 6328, Photography—Determination of ISO Resolving Power
  development: KODAK Developer D-76, 68 F (20 C)
- id: resolving-power-toc-1000
  value: 200
  unit: lines/mm
  printed: 200 lines/mm (TOC 1000:1)
  source: f4016-2018-06
  page: '8'
  where: IMAGE STRUCTURE table, row T-MAX 100, column Resolving Power
  measurement: test-object contrast 1000:1; method similar to ISO 6328
  development: KODAK Developer D-76, 68 F (20 C)
- id: base-type
  value: null
  unit: null
  source: f4016-2018-06
  page: 1-9
