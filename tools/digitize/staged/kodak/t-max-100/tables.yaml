    '*': Pushing exposure results in slight losses of quality compared with normal exposure and normal
      processing. Other Kodak developers can be used for pushing, but T-MAX Developer and T-MAX RS Developer
      and Replenisher give better shadow detail. When deep-shadow detail matters, increase exposure by
      2 stops and process normally.
