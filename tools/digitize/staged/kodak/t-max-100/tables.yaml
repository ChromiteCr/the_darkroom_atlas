development_time_adjustment_factors:
  source: f4016-2018-06
  page: '7'
  table: Development-Time Adjustment Factors (CONTRAST ADJUSTMENT)
  columns: [20% Less Contrast, Normal Contrast, 20% More Contrast, 40% More Contrast]
  contrast_change_percent: [-20, 0, 20, 40]
  statement: The factors are based on a developer temperature of 75 F (24 C) for the KODAK PROFESSIONAL
    T-MAX developers and 68 F (20 C) for the others; the standard for each developer is 1.0. Multiply
    the standard development time by the factor to find the time for a different contrast or developer
    temperature (or both). The tables apply to negatives printed with a diffusion enlarger; with a condenser
    enlarger, shift the selection one column to the left.
  footnotes:
    '*': If you select one of these factors, add one stop to your camera exposure.
    NR: Not recommended
  note: 'The HC-110 block heading reads ''KODAK HC-110 Developer Replenisher (Dilution B)'' as printed.
    The factors are rounded guidance and only roughly consistent with the time tables: for example D-76
    small tank, 18 C: 1.2 x 6½ = 7.8 min against 7½ in the p. 3 table; T-MAX (1:4) small tank, 20 C: 1.2
    x 6¼ = 7.5 min, which matches.'
