- id: base-thickness-120
  value: 4.7
  unit: mil
  value_mm: 0.119
  derived_mm: 4.7 mil x 0.0254 mm/mil = 0.119 mm (conversion, not printed)
  source: f4016-2007-10
  page: '2'
  where: FEATURES / BENEFITS table
  statement: 120-size film coated on a thicker (4.7-mil) base than other black-and-white roll films. The
    feature list is printed once for KODAK PROFESSIONAL T-MAX Films (100, 400 and P3200), not for T-MAX
    100 alone; the base material is not named. The June 2018 edition drops the statement.
