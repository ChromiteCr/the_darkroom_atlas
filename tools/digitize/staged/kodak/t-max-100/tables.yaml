    repeat the normal 20 C and 24 C times of the matching tables on pp. 3-4, except: XTOL in large tank
    (rolls and sheets) has no EI 200 time (''—''), and XTOL (1:1) in rotary tube, rolls, gives 7¾ min
    at 24 C against 6¾ in the normal rolls table (the normal sheets table gives 7¾)'
