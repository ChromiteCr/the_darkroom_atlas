- id: spectral-sensitivity-blue-note
  value: null
  unit: null
  source: f4016-2007-10
  page: '14'
  where: footnote under the T-MAX 400 spectral-sensitivity curves
  statement: The blue sensitivity of KODAK PROFESSIONAL T-MAX Films is slightly less than that of other
    Kodak panchromatic black-and-white films, so blues may be recorded as slightly darker tones. The June
    2018 edition drops the footnote.
